<style>
:root{--bg:#f3f2f8;--card:#fff;--ink:#1c1b2b;--muted:#5f5d73;--line:#dddbe8;--accent:#3b3486;--on-accent:#fff;--pop:#c2410c;--good:#2b8a3e;--bad:#c92a2a;--goodbg:#ebfbee;--badbg:#fff5f5;--chip:#ece7dc;--head:"Fraunces",Georgia,serif}
@media (prefers-color-scheme:dark){:root{--bg:#121220;--card:#1b1a2c;--ink:#eeedf6;--muted:#a6a4ba;--line:#302e45;--accent:#a9a2f2;--on-accent:#1b1a2c;--pop:#fb923c;--good:#8ce99a;--bad:#ff8787;--goodbg:#173022;--badbg:#3a1f22;--chip:#242c2b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:480px;margin:0 auto;padding:16px 16px 40px;min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
h1{font-family:var(--head);font-weight:800;font-size:34px;margin:0;line-height:1;letter-spacing:-.5px}
h1 svg{width:32px;height:32px;vertical-align:-5px;margin-right:6px}
.pips{display:flex;gap:5px}
.pip{width:12px;height:12px;border-radius:50%;background:var(--line)}
.pip.g{background:var(--good)}.pip.x{background:var(--bad)}.pip.now{background:var(--pop)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.tag{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:600}
.kind{font-family:var(--head);font-weight:800;font-size:22px;margin:4px 0 2px}
.sub{color:var(--muted);font-size:15px;margin:0 0 12px}
.phrase{font:600 28px/1.25 var(--head);text-align:center;margin:10px 0 16px}
.phrase .gap{display:inline-block;min-width:3.2em;border-bottom:3px solid var(--pop);color:var(--pop)}
.opts{display:grid;gap:8px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{display:block;width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);font:600 18px/1.3 system-ui,-apple-system,sans-serif;color:var(--ink);cursor:pointer;min-height:54px}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt:focus-visible,.primary:focus-visible,.mt:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--good);background:var(--goodbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt.dim{opacity:.5}
.match{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}
.col{display:grid;gap:8px}
.mt{position:relative;width:100%;padding:12px 10px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);font:600 16px/1.25 system-ui,-apple-system,sans-serif;color:var(--ink);cursor:pointer;min-height:50px}
.mt.sel{border-color:var(--pop);box-shadow:0 0 0 2px var(--pop) inset}
.mt[data-c]::after{content:attr(data-c);position:absolute;top:-8px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-size:12px;line-height:20px;text-align:center}
.mt.right{border-color:var(--good);background:var(--goodbg)}
.mt.wrong{border-color:var(--bad);background:var(--badbg)}
.mt[disabled]{cursor:default}
.reveal{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--chip);font-size:15px}
.reveal ul{margin:6px 0 0;padding-left:18px}
.btns{display:flex;gap:10px;margin-top:14px}
button{font:inherit;color:inherit;cursor:pointer}
.primary{flex:1;padding:14px;border:0;border-radius:12px;background:var(--accent);color:var(--on-accent);font-weight:700;min-height:50px}
.primary[disabled]{opacity:.4;cursor:default}
.ghost{padding:14px 16px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);font-weight:600;min-height:50px}
.center{text-align:center}
.rank{font-family:var(--head);font-weight:800;font-size:30px;margin:6px 0}
.squares{font-size:24px;letter-spacing:3px;margin:6px 0 4px}
.muted{color:var(--muted);font-size:15px}
a{color:var(--accent)}
.test{background:var(--chip);border-radius:10px;padding:8px 12px;font-size:14px;margin-bottom:12px}
.ex{margin:0 0 12px;font-size:15px}.ex summary{cursor:pointer;color:var(--accent);font-weight:600}
.how{margin:8px 0 0;padding-left:20px;color:var(--muted)}
.how li{margin:3px 0}
.recap{list-style:none;padding:0;margin:8px 0 0}
.recap li{padding:10px 0;border-top:1px solid var(--line)}
.recap .v{font:600 18px/1.3 var(--head)}
.recap .n{font-size:14px;color:var(--muted);margin-top:2px}
footer{margin-top:18px;text-align:center}
.term{font:700 30px/1.2 var(--head);text-align:center;margin:10px 0 4px}
.clue{text-align:center;color:var(--muted);font-size:16px;margin:0 0 16px}
.saying{font:600 26px/1.25 var(--head);text-align:center;margin:10px 0 16px}
.saying::before{content:"\201C"}.saying::after{content:"\201D"}
.ord{display:grid;gap:8px}
.ord .mt{text-align:left;padding-left:44px}
.ord .mt[data-c]::after{top:50%;left:12px;right:auto;transform:translateY(-50%);width:24px;height:24px;line-height:24px;font-size:13px}
.ord .val{display:block;font-weight:400;font-size:14px;color:var(--muted)}
.ordask{font-weight:600;text-align:center;margin:4px 0 12px}
</style>
<link rel="manifest" href="/manifest.webmanifest">
</head>
<body>
<main>
  <header><h1><svg viewBox="0 0 64 64" aria-hidden="true"><rect x="4" y="4" width="56" height="56" rx="14" fill="#3b3486"/><path d="M19 34h20l3 18H16z" fill="#f3f2f8"/><rect x="23" y="29" width="12" height="6" rx="1.5" fill="#f3f2f8"/><path d="M18 45h24l-1 7H17z" fill="#1c1b2b"/><path d="M30 31 50 9c2 3 1 9-4 13l-14 11z" fill="#fb923c"/><path d="M30 31l16-16" stroke="#3b3486" stroke-width="1.5"/></svg>Inkling</h1><div class="pips" id="pips" aria-hidden="true"></div></header>
  <nav class="sy-bar" aria-label="Games"></nav>
  <div id="test"></div>
  <div id="app"></div>
  <footer><p class="muted"><a href="/feedback/?game=inkling">Send feedback</a> · <a href="/support/?game=inkling">Support the games</a></p></footer>
</main>
<script src="data.js"></script>
<script>
// ---- Which day is on screen ----
// Preview: today's puzzle depends on the weekday (see data.js). ?day=N plays Inkling No. N; #test plays without saving.
const START=Date.UTC(2026,10,21);
const dayDate=n=>new Date(START+n*864e5);
const fmt=(n,o)=>dayDate(n).toLocaleDateString('en-GB',Object.assign({timeZone:'UTC'},o));
const keyOf=n=>{const d=dayDate(n);return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0')};
addEventListener('hashchange',()=>location.reload());
const params=new URLSearchParams(location.search);
const now=new Date();
const TODAY=Math.max(0,Math.round((Date.UTC(now.getFullYear(),now.getMonth(),now.getDate())-START)/864e5));
const isTest=location.hash==='#test';
const td=parseInt(params.get('day'),10);
const N=Number.isInteger(td)&&td>=1?td-1:TODAY;
const EPOCH=Math.round(dayDate(N)/864e5)+3; // 1 Jan 1970 was a Thursday; Monday = 0
const WD=EPOCH%7, WEEKS=DAYS.length/7;
// Days before 23 Nov 2026 (launch weekend) keep Week 1. From then on, ORDER says which data week plays:
// the new Weeks 2 and 3 first, then Week 1. Add new weeks to ORDER.
const WN=Math.floor(EPOCH/7), WS=2969; // WS = week of 23 Nov 2026
const ORDER=[1,2,0];
const WK=WN<WS?0:ORDER[(WN-WS)%ORDER.length];
const BASE=DAYS[WK*7+WD];
// From the second time through, every other round slides one place per pass, so the same set of rounds never comes back together.
const mixPick=(j,L,r)=>(j%L+Math.floor(j/L)*(r%2))%L;
const D=WN<WS?BASE:Object.fromEntries(Object.keys(BASE).map((key,r)=>[key,DAYS[ORDER[mixPick(WN-WS,ORDER.length,r)]*7+WD][key]]));
const THEME=WD===5?'Science fiction':'';
const SKEY='inkling-'+keyOf(N);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){if(isTest)return;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function shuffled(arr,seed){const a=[...arr];let s=seed*9301+49297;for(let i=a.length-1;i>0;i--){s=(s*9301+49297)%233280;const j=Math.floor(s/233280*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
// For the ordering round: never show the items already in the right order.
function jumbled(arr,seed){let a=shuffled(arr,seed);if(a.every((v,k)=>v===arr[k]))a=[...arr.slice(1),arr[0]];return a}

const ORDER=D.q.i.map(p=>p[0]);
const ROUNDS=[
  {type:'pick',name:'Who coined it?',d:D.p,opts:shuffled([D.p.c,...D.p.o],N*13+1)},
  {type:'odd',name:'Odd one out',d:D.x,opts:shuffled([...D.x.w,D.x.odd],N*13+3)},
  {type:'match',name:'Match them',d:D.m,right:shuffled(D.m.map(p=>p[1]),N*13+5)},
  {type:'order',name:'Put in order',d:D.q,items:jumbled(ORDER,N*13+4)},
  {type:'saying',name:'Which book?',d:D.s,opts:shuffled([D.s.c,...D.s.o],N*13+2)}
];
const MAX=ROUNDS.length;

let st=store.get(SKEY)||{r:0,ans:[],ok:[],done:false};
let pairs={},pickL=null; // match round, while playing
let seq=[];             // order round, while playing
const $=s=>document.querySelector(s);
const app=$('#app');
function save(){store.set(SKEY,st)}
const score=()=>st.ok.filter(Boolean).length;
function rank(t){return['Blank page','Scribbler','Hack','Wordsmith','Author','Coiner-in-chief'][t]}
function pips(cur){$('#pips').innerHTML=ROUNDS.map((_,i)=>`<span class="pip ${st.ok[i]===true?'g':st.ok[i]===false?'x':i===cur?'now':''}"></span>`).join('')}
const optBtns=(opts,right,i,answered)=>`<div class="opts two" role="group" aria-label="Choices">${opts.map(o=>`<button class="opt${!answered?'':o===right?' right':o===st.ans[i]?' wrong':' dim'}" data-o="${esc(o)}"${answered?' disabled':''}>${esc(o)}</button>`).join('')}</div>`;

function play(){
  const i=st.r,R=ROUNDS[i],answered=st.ok[i]!=null;
  pips(i);
  let body='',sub='',note='';
  if(R.type==='pick'){
    sub='Which writer first gave us this word?';
    body=`<div class="term">${esc(R.d.t)}</div><p class="clue">${esc(R.d.h)}</p>${optBtns(R.opts,R.d.c,i,answered)}`;
    note=R.d.n;
  }else if(R.type==='saying'){
    sub='Which book or play did this come from?';
    body=`<div class="saying">${esc(R.d.t)}</div>${optBtns(R.opts,R.d.c,i,answered)}`;
    note=R.d.n;
  }else if(R.type==='odd'){
    sub='Three of these were coined in fiction. Which wasn’t?';
    body=`${optBtns(R.opts,R.d.odd,i,answered)}`;
    note=`The other three are ${R.d.f}. ${R.d.n}`;
  }else if(R.type==='order'){
    sub='Tap them in order, first to last.';
    const got=answered?st.ans[i]:seq;
    const pos=w=>got.indexOf(w);
    const val=w=>R.d.i.find(p=>p[0]===w)[1];
    const list=answered?ORDER:R.items;
    body=`<p class="ordask">${esc(R.d.ask)}</p><div class="ord">${list.map((w,k)=>{
      const c=answered?k+1:(pos(w)>=0?pos(w)+1:0);
      const cls=answered?(st.ans[i][k]===w?' right':' wrong'):(pos(w)>=0?' sel':'');
      return`<button class="mt${cls}" data-w="${esc(w)}"${c?` data-c="${c}"`:''}${answered?' disabled':''}>${esc(w)}${answered?`<span class="val">${esc(val(w))}</span>`:''}</button>`}).join('')}</div>
      ${answered?'':`<div class="btns"><button class="ghost" id="clr"${seq.length?'':' disabled'}>Clear</button><button class="primary" id="chk"${seq.length===ORDER.length?'':' disabled'}>Check</button></div>`}`;
    if(answered)note=(st.ok[i]?'':'That’s the right order above. ')+R.d.n;
  }else{
    sub='Tap a word on the left, then the book or play it came from.';
    const L=R.d.map(p=>p[0]);
    const done=answered?st.ans[i]:pairs;
    const num=w=>L.indexOf(w)+1;
    const leftCls=w=>{if(answered){return done[w]===R.d.find(p=>p[0]===w)[1]?' right':' wrong'}return pickL===w?' sel':''};
    const owner=x=>Object.keys(done).find(k=>done[k]===x);
    body=`<div class="match"><div class="col">${L.map(w=>`<button class="mt${leftCls(w)}" data-l="${esc(w)}"${done[w]?` data-c="${num(w)}"`:''}${answered?' disabled':''}>${esc(w)}</button>`).join('')}</div>
      <div class="col">${R.right.map(n=>{const o=owner(n);return`<button class="mt" data-r="${esc(n)}"${o?` data-c="${num(o)}"`:''}${answered?' disabled':''}>${esc(n)}</button>`}).join('')}</div></div>
      ${answered?'':`<div class="btns"><button class="ghost" id="clr"${Object.keys(pairs).length?'':' disabled'}>Clear</button><button class="primary" id="chk"${Object.keys(pairs).length===4?'':' disabled'}>Check</button></div>`}`;
    if(answered){const wrong=R.d.filter(p=>done[p[0]]!==p[1]);note=wrong.length?`The right pairs: ${R.d.map(p=>`${p[0]} → ${p[1]}`).join(', ')}.`:'All four right!'}
  }
  const reveal=answered?`<div class="reveal" role="status"><b>${st.ok[i]?'Yes!':'Not quite.'}</b> ${esc(note)}</div>
    <div class="btns"><button class="primary" id="next">${i+1<MAX?'Next round':'See how you did'}</button></div>`:'';
  app.innerHTML=`<div class="card">
    <div class="tag">${isTest?'Test · ':''}No. ${N+1} · ${fmt(N,{weekday:'short',day:'numeric',month:'short'})}${THEME?' · '+THEME:''} · Round ${i+1} of ${MAX}</div>
    <div class="kind">${R.name}</div>
    <p class="sub">${sub}</p>
    ${i===0&&!answered?`<details class="ex"><summary>How to play</summary><ol class="how">
      <li>Five quick rounds on words first made up in novels, plays and stories, one point each.</li>
      <li>Name who coined a word, spot the one that didn't come from fiction, match words to books, put coinages in date order, then name the book.</li>
      <li>Saturdays are science fiction.</li></ol></details>`:''}
    ${body}${reveal}
  </div>`;
  if(!answered){
    if(R.type==='pick'||R.type==='saying'||R.type==='odd'){const right=R.type==='odd'?R.d.odd:R.d.c;app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{st.ans[i]=b.dataset.o;st.ok[i]=b.dataset.o===right;save();play()})}
    if(R.type==='order'){
      app.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{const w=b.dataset.w;const k=seq.indexOf(w);if(k>=0)seq=seq.slice(0,k);else seq.push(w);play()});
      $('#clr').onclick=()=>{seq=[];play()};
      $('#chk').onclick=()=>{st.ans[i]=[...seq];st.ok[i]=seq.every((w,k)=>w===ORDER[k]);seq=[];save();play()};
    }
    if(R.type==='match'){
      app.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{const w=b.dataset.l;delete pairs[w];pickL=w;play()});
      app.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{if(!pickL)return;const n=b.dataset.r;for(const k in pairs)if(pairs[k]===n)delete pairs[k];pairs[pickL]=n;pickL=null;play()});
      $('#clr').onclick=()=>{pairs={};pickL=null;play()};
      $('#chk').onclick=()=>{st.ans[i]={...pairs};st.ok[i]=R.d.every(p=>pairs[p[0]]===p[1]);save();play()};
    }
  }
  const nb=$('#next');if(nb){nb.onclick=()=>{if(st.r+1<MAX){st.r++;save();play()}else{st.done=true;save();end()}};nb.focus({preventScroll:true})}
}

function end(){
  pips(-1);
  const t=score();
  const sq=ROUNDS.map((_,i)=>st.ok[i]?'🟩':'⬜').join('');
  if(!isTest&&N===TODAY)(window.SameySetQ=window.SameySetQ||[]).push(['inkling',t+'/'+MAX]);
  const share=`Inkling No. ${N+1}\n${sq} ${t}/${MAX}\n${rank(t)}\nYour go: https://samey.uk/inkling/ #sameyuk`;
  const items=ROUNDS.map((R,i)=>{const mk=st.ok[i]?'✓':'✗';
    if(R.type==='pick')return`<li><div class="v">${mk} ${esc(R.d.t)}: ${esc(R.d.c)}</div><div class="n">${esc(R.d.n)}</div></li>`;
    if(R.type==='saying')return`<li><div class="v">${mk} “${esc(R.d.t)}”: <i>${esc(R.d.c)}</i></div><div class="n">${esc(R.d.n)}</div></li>`;
    if(R.type==='odd')return`<li><div class="v">${mk} ${esc(R.d.odd)} was the odd one out</div><div class="n">${esc(R.d.n)}</div></li>`;
    if(R.type==='order')return`<li><div class="v">${mk} ${R.d.i.map(p=>esc(p[0])).join(' → ')}</div><div class="n">${esc(R.d.ask)}. ${esc(R.d.n)}</div></li>`;
    return`<li><div class="v">${mk} ${R.d.map(p=>`${esc(p[0])} → ${esc(p[1])}`).join(' · ')}</div></li>`}).join('');
  app.innerHTML=`<div class="card center">
    <div class="tag">${isTest?'Test · ':''}No. ${N+1} · ${fmt(N,{weekday:'short',day:'numeric',month:'short'})}</div>
    <div class="rank">${rank(t)}</div>
    <div class="squares" aria-label="${t} out of ${MAX}">${sq}</div>
    <p class="muted">${t} of ${MAX} correct</p>
    <div class="btns"><button class="primary" id="share">Share</button></div>
    <p class="muted"><span data-next="Next Inkling in {t}.">New words tomorrow.</span></p>
    <p class="muted">All the games are free and ad-free, made by one librarian in Canterbury. Enjoyed today's? <a href="https://ko-fi.com/playtheroute" target="_blank" rel="noopener" style="font-weight:700;white-space:nowrap">☕ Buy me a coffee</a></p>
  </div>
  <div class="card" style="margin-top:14px"><div class="tag">Today's words</div>
    <ul class="recap">${items}</ul>
    <p class="muted" style="margin-top:12px">Think one's wrong, or know a better one? <a href="/feedback/?game=inkling&type=puzzle&puzzle=${encodeURIComponent('No. '+(N+1))}">Tell us</a>.</p>
  </div>`;
  $('#share').onclick=()=>{if(navigator.share){navigator.share({text:share}).catch(()=>{});return}try{navigator.clipboard.writeText(share).then(()=>{$('#share').textContent='Copied'})}catch(e){}};
}

if(isTest)$('#test').innerHTML=`<div class="test">Test mode: No. ${N+1} · results not saved · <a href="?day=${N+2}#test">Next day</a></div>`;
st.done?end():play();
</script>
<script src="/daily.js"></script>
