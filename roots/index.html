<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Roots</title>
<meta name="description" content="A daily game of word origins. Where words came from, what they used to mean, and their long-lost relatives.">
<link rel="icon" href="/roots/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/roots/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:url" content="https://samey.uk/roots/">
<meta property="og:site_name" content="Roots">
<meta property="og:title" content="Roots: where words come from">
<meta property="og:description" content="Four quick rounds a day on where words came from and how they changed.">
<meta property="og:image" content="https://samey.uk/roots/og-image.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap">
<style>
:root{--bg:#f6f3ee;--card:#fff;--ink:#1f1b16;--muted:#675e53;--line:#e3dbcf;--accent:#7a4a1e;--on-accent:#fff;--good:#2f7d32;--bad:#c92a2a;--goodbg:#ebf7ec;--badbg:#fff5f5;--chip:#f2ece3;--head:"Fraunces","Iowan Old Style",Georgia,serif}
@media (prefers-color-scheme:dark){:root{--bg:#15130f;--card:#201d18;--ink:#f2ede5;--muted:#a89e90;--line:#3a352d;--accent:#e0a86a;--on-accent:#1f1b16;--good:#69d27a;--bad:#ff7b7b;--goodbg:#1c3121;--badbg:#3a1f22;--chip:#2b2720}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:480px;margin:0 auto;padding:16px 16px 40px;min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
h1{font-family:var(--head);font-weight:800;font-size:32px;margin:0;line-height:1;letter-spacing:-.5px}
h1 svg{width:26px;height:26px;vertical-align:-3px;margin-right:6px}
.dots{display:flex;gap:6px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dot.cur{background:var(--accent)}.dot.ok{background:var(--good)}.dot.no{background:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.tag{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:600}
.q{font-size:19px;font-weight:600;margin:6px 0 4px}
.entry{border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:14px}
.word{font-family:var(--head);font-weight:600;font-size:clamp(34px,10vw,46px);line-height:1.05;margin:6px 0 4px;overflow-wrap:anywhere}
.gloss{color:var(--muted);font-size:16px}
.gloss i{color:var(--ink)}
.opts{display:grid;gap:10px;margin-top:14px}
.opts.two{grid-template-columns:1fr 1fr}
button{font:inherit;color:inherit;cursor:pointer}
.opt{text-align:left;padding:14px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);min-height:52px}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt:focus-visible,.primary:focus-visible,.ghost:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.opt.right{border-color:var(--good);background:var(--goodbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt.right::after{content:" ✓";font-weight:700}.opt.wrong::after{content:" ✗";font-weight:700}
.opt.dim{opacity:.55}
.opt[disabled]{cursor:default}
/* Then and now: tap meanings in order */
.opt.ord{display:flex;align-items:center;gap:12px}
.num{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px dashed var(--line);display:grid;place-items:center;font-weight:700;font-size:15px}
.opt.ord.picked .num{border:0;background:var(--accent);color:var(--on-accent)}
.opt.ord.right .num{background:var(--good);color:#fff;border:0}
.opt.ord.wrong .num{background:var(--bad);color:#fff;border:0}
.opt.ord.right::after,.opt.ord.wrong::after{margin-left:auto}
.reveal{margin-top:16px;padding:14px 16px;border-radius:12px;background:var(--chip)}
.reveal b{display:block;margin-bottom:4px}
.reveal ol{margin:6px 0 8px;padding-left:22px}
.reveal .more{display:block;margin-top:8px;font-size:14px}
.reveal .more a{color:inherit}
.primary{display:block;width:100%;margin-top:16px;padding:14px;border:0;border-radius:12px;background:var(--accent);color:var(--on-accent);font-weight:600}
.primary[disabled]{opacity:.45;cursor:default}
.ghost{display:block;width:100%;margin-top:10px;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:none;font-weight:600}
.center{text-align:center}
.ticks{font-size:34px;letter-spacing:4px;margin:10px 0}
.score{font-family:var(--head);font-weight:800;font-size:52px;margin:4px 0;line-height:1}
.rank{font-size:20px;font-weight:700;color:var(--accent)}
.muted{color:var(--muted)}
ul.rounds{padding-left:20px;margin:10px 0 0}
ul.rounds li{margin-bottom:4px}
.recap{list-style:none;padding:0;margin:16px 0 0;display:grid;gap:12px;text-align:left;border-top:1px solid var(--line);padding-top:14px}
.recap li{display:grid;grid-template-columns:auto 1fr;gap:2px 10px}
.recap .h{font-family:var(--head);font-weight:600;font-size:20px;line-height:1.2}
.recap .m{grid-column:2;color:var(--muted);font-size:15px}
.recap .flag{grid-column:2;font-size:13px;color:var(--muted)}
.recap .flag a{color:inherit}
footer{margin-top:24px;text-align:center;font-size:15px}
footer a{color:var(--accent);text-decoration:none;margin:0 6px}
footer .games{display:flex;flex-wrap:wrap;justify-content:center;gap:2px 0;margin:0}
footer .games .muted{flex-basis:100%}
.test{font-size:13px;color:var(--bad);text-align:center;margin-bottom:8px}
.archline{font-size:15px;color:var(--muted);margin:-4px 0 12px}
.archline a,.card a.inl{color:var(--accent);font-weight:600}
.archlist{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:8px}
.archlist a{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;min-height:52px;border:1.5px solid var(--line);border-radius:12px;color:inherit;text-decoration:none;font-weight:600}
.archlist a:hover{border-color:var(--ink)}
.archlist .when{font-weight:400;color:var(--muted);font-size:15px}
.archlist .st{font-size:15px;white-space:nowrap;color:var(--muted)}
.archlist .st.done{color:var(--good)}
a.primary{text-align:center;text-decoration:none}

/* Cross-game cards (same design as Samey's result cards) */
.card + .xg{margin-top:14px}
.xg{display:flex;flex-direction:column;gap:10px;text-align:left;--xg-s:var(--surface,var(--card,#fff))}
.xg .xg-head{text-align:left;margin:4px 0 0;font-size:.92rem;font-weight:700;color:var(--muted)}
.xg-card{--c:#1f7a6d;display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:10px;background:color-mix(in srgb,var(--c) 12%,var(--xg-s));border:2px solid var(--c);color:var(--ink);text-decoration:none;min-height:44px}
.xg-card:hover .xg-arrow{transform:translateX(3px)}
.xg-card:focus-visible{outline:3px solid var(--c);outline-offset:2px}
.xg-icon{flex:none;width:48px;height:48px}
.xg-text{display:flex;flex-direction:column;gap:1px;min-width:0}
.xg-new{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:color-mix(in srgb,var(--c) 60%,var(--ink))}
.xg-title{font-family:var(--display,inherit);font-weight:800;font-size:1.3rem;line-height:1.1}
.xg-sub{font-size:.9rem;color:var(--muted)}
.xg-arrow{margin-left:auto;font-size:1.4rem;font-weight:700;flex:none;color:color-mix(in srgb,var(--c) 60%,var(--ink));transition:transform .15s}
.xg-samey{--c:#1f7a6d}.xg-spinonym{--c:#d99a1e}.xg-dotty{--c:#E2405A}.xg-syntaxed{--c:#3B5BDB}.xg-passe{--c:#7B3F73}.xg-natter{--c:#B0186A}.xg-roots{--c:#8A5A2B}
@media (prefers-reduced-motion:no-preference){.reveal{animation:up .2s ease-out}@keyframes up{from{transform:translateY(6px);opacity:.4}to{transform:none;opacity:1}}}
</style>
</head>
<body>
<main>
  <header><h1><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 6v26" stroke="currentColor" stroke-width="6" stroke-linecap="round"/><path d="M32 30c0 10-14 10-18 22M32 30c0 10 14 10 18 22M32 32v24" stroke="var(--accent)" stroke-width="5" fill="none" stroke-linecap="round"/><circle cx="32" cy="10" r="8" fill="var(--good)"/></svg>Roots</h1><div class="dots" id="dots"></div></header>
  <div id="test"></div>
  <p class="archline" id="archLine" hidden></p>
  <div id="app"></div>
  <footer><p class="games"><span class="muted">More games:</span><a href="/">Samey</a><a href="/spinonym/">Spinonym</a><a href="/dotty/">Dotty</a><a href="/syntaxed/">Syntaxed</a><a href="/passe/">Passé</a><a href="/natter/">Natter</a></p>
  <p class="muted" style="margin-top:10px"><span id="archFoot" hidden><a href="#" id="archLink">Earlier puzzles</a> · </span><a href="/feedback/?game=roots">Send feedback</a> · <a href="/support/?game=roots">Support us</a></p></footer>
</main>
<script src="data.js"></script>
<script>
// ---- Schedule ----
// Roots No. 1 is START. Each day takes the next item from each of the four lists in data.js.
// Lists start again from the top when they run out, so add more before then (the shortest list sets the limit).
const START=Date.UTC(2026,9,20);
const dayDate=n=>new Date(START+n*864e5);   // read with UTC getters
const keyOf=n=>{const d=dayDate(n);return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0')};
const fmt=(n,o)=>dayDate(n).toLocaleDateString('en-GB',Object.assign({timeZone:'UTC'},o));
const ROUNDS=[
  {key:'from',name:"Where's it from?",blurb:'Which language gave us the word?',list:FROM},
  {key:'then',name:'Then and now',blurb:'Put its meanings in order, oldest first',list:THEN},
  {key:'family',name:'Root family',blurb:"Spot the lookalike that isn't related",list:FAMILY},
  {key:'twins',name:'Long-lost twins',blurb:'Find the word with the same ancestor',list:TWINS}
];
const itemsFor=n=>ROUNDS.map(r=>r.list[n%r.list.length]);

// ---- Which day is on screen ----
// samey.uk/roots/#test plays today without saving; add ?day=N for Roots No. N (any day, past or future).
// ?day=N on its own opens an earlier puzzle from the archive.
const ARCHIVE_ON=true;
addEventListener('hashchange',()=>location.reload());
const params=new URLSearchParams(location.search);
const now=new Date();
const TODAY=Math.max(0,Math.round((Date.UTC(now.getFullYear(),now.getMonth(),now.getDate())-START)/864e5));
const isTest=location.hash==='#test';
const ARCH=ARCHIVE_ON||isTest||location.hash==='#archive';
const ARCH_TAIL=ARCHIVE_ON?(isTest?'#test':''):(isTest?'#test':'#archive');
const td=parseInt(params.get('day'),10);
const N=Number.isInteger(td)&&td>=1&&(isTest||(ARCH&&td<=TODAY))?td-1:TODAY;
const isArch=!isTest&&N<TODAY;
const dateKey=keyOf(N);
const items=itemsFor(N);
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

// Seeded shuffle so everyone sees the same option order on the same day
function rng(seed){let h=1779033703^seed.length;for(let i=0;i<seed.length;i++){h=Math.imul(h^seed.charCodeAt(i),3432918353);h=h<<13|h>>>19}return function(){h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);h^=h>>>16;return(h>>>0)/4294967296}}
function order(n,seed){const r=rng(seed),a=[...Array(n).keys()];for(let i=n-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

const $=s=>document.querySelector(s);
const app=$('#app');
let st={i:0,res:[]};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const strip=s=>String(s).replace(/<[^>]+>/g,'');
const etym=w=>`<span class="more">Find out more: <a href="https://www.etymonline.com/search?q=${encodeURIComponent(w)}" target="_blank" rel="noopener">${esc(w)} on Etymonline</a></span>`;
const headWord=(k,it)=>k==='family'?it.r+'-':it.w;

function dots(){$('#dots').innerHTML=items.map((_,k)=>`<div class="dot ${st.res[k]===true?'ok':st.res[k]===false?'no':k===st.i?'cur':''}"></div>`).join('')}

function intro(){
  app.innerHTML=`<div class="card"><div class="tag">${isArch||isTest?fmt(N,{weekday:'long',day:'numeric',month:'long'}):'Today'}</div>
  <div class="q">Four quick rounds on where words come from.</div>
  <p class="muted" style="margin:6px 0 0">One go at each. You'll find out the story after every answer.</p>
  <ul class="rounds">${ROUNDS.map((r,k)=>`<li><b>${r.name}</b> · ${r.blurb}</li>`).join('')}</ul>
  <button class="primary" id="go">Play</button></div>`;
  $('#go').onclick=()=>{st={i:0,res:[]};round()};
  dots();
}

function shell(k,it,head,q,body){
  const R=ROUNDS[st.i];
  return `<div class="card"><div class="entry"><div class="tag">Round ${st.i+1} · ${R.name}</div>
  <div class="word">${head}</div>${it.g?`<div class="gloss">means ${it.g}</div>`:''}</div>
  <div class="q">${q}</div>${body}<div id="after" aria-live="polite"></div></div>`;
}

// Rounds 1, 3 and 4: pick one of four
function pickRound(k,it){
  let opts,right,q;
  if(k==='from'){opts=[it.a,...it.f];q='Which language did English get it from?'}
  else if(k==='family'){opts=[it.n,...it.y];q='Three of these come from this root. Which one is the odd one out?'}
  else {opts=[it.a,...it.f];q=`Which word shares an ancestor with <i>${esc(it.w)}</i>?`}
  const ord=order(4,dateKey+'|'+st.i+'|'+headWord(k,it));
  app.innerHTML=shell(k,it,esc(headWord(k,it)),q,`<div class="opts${k==='from'?' two':''}">${ord.map(x=>`<button class="opt" data-k="${x}">${esc(opts[x])}</button>`).join('')}</div>`);
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const ok=+b.dataset.k===0;
    app.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(+x.dataset.k===0)x.classList.add('right');else if(x!==b)x.classList.add('dim')});
    if(!ok)b.classList.add('wrong');
    after(ok,it.o+etym(k==='family'?it.n:k==='twins'?it.a:it.w));
  });
}

// Round 2: tap the meanings oldest first
function orderRound(it){
  let ord=order(3,dateKey+'|then|'+it.w);
  if(ord.join()==='0,1,2')ord=[1,2,0];   // never show them already in order
  const picks=[];
  app.innerHTML=shell('then',it,esc(it.w),'Tap its meanings in order, oldest first.',
    `<div class="opts">${ord.map(x=>`<button class="opt ord" data-k="${x}" aria-pressed="false"><span class="num" aria-hidden="true"></span><span>${esc(it.m[x])}</span></button>`).join('')}</div>
    <button class="primary" id="check" disabled>Check</button><p class="muted" id="undoTip" style="font-size:14px;margin:8px 0 0;text-align:center">Tap a numbered one again to undo it.</p>`);
  const btns=[...app.querySelectorAll('.opt')];
  const paint=()=>{btns.forEach(b=>{const p=picks.indexOf(+b.dataset.k);b.classList.toggle('picked',p>=0);b.querySelector('.num').textContent=p>=0?p+1:'';b.setAttribute('aria-pressed',p>=0);b.setAttribute('aria-label',(p>=0?`Number ${p+1}: `:'')+it.m[+b.dataset.k])});$('#check').disabled=picks.length<3};
  btns.forEach(b=>b.onclick=()=>{const k=+b.dataset.k,p=picks.indexOf(k);if(p>=0)picks.splice(p,1);else if(picks.length<3)picks.push(k);paint()});
  $('#check').onclick=()=>{
    const ok=picks.every((k,p)=>k===p);
    btns.forEach(b=>{const k=+b.dataset.k;b.disabled=true;b.classList.remove('picked');b.classList.add(picks.indexOf(k)===k?'right':'wrong')});
    $('#check').remove();$('#undoTip').remove();
    after(ok,`<ol>${it.m.map(m=>`<li>${esc(m)}</li>`).join('')}</ol>${it.o}${etym(it.w)}`,ok?'Right order.':'Not quite. Here is the right order:');
  };
  paint();
}

function round(){
  const k=ROUNDS[st.i].key,it=items[st.i];dots();
  if(k==='then')orderRound(it);else pickRound(k,it);
}

function after(ok,html,head){
  st.res[st.i]=ok;dots();
  const last=st.i===items.length-1;
  $('#after').innerHTML=`<div class="reveal"><b>${head||(ok?'Correct.':'Not quite. The right one is highlighted.')}</b>${html}</div><button class="primary" id="next">${last?'See results':'Next round'}</button>`;
  const nx=$('#next');
  nx.onclick=()=>{if(last){if(!isTest)store.set('roots-'+dateKey,st.res);results()}else{st.i++;round();window.scrollTo(0,0)}};
  nx.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function rank(s){return['Seedling','Sprout','Sapling','Old Oak','Family Tree'][s]}
function recapLine(k,it){
  if(k==='from')return[it.w,`from ${it.a}`];
  if(k==='then')return[it.w,it.m.join(' → ')];
  if(k==='family')return[it.r+'-',`odd one out: ${it.n}`];
  return[it.w,`twin: ${it.a}`];
}

function results(){
  st.i=items.length;dots();
  const s=st.res.filter(Boolean).length,n=items.length;
  const ticks=st.res.map(x=>x?'✅':'❌').join('');
  if(!isTest&&!isArch)(window.SameySetQ=window.SameySetQ||[]).push(['roots',s+'/'+n]);
  const nice=fmt(N,{weekday:'short',day:'numeric',month:'short'});
  const share=`Roots ${isArch?`No. ${N+1} (archive)`:nice}\n${s}/${n} ${ticks}\n${rank(s)}\nsamey.uk/roots/`;
  app.innerHTML=`<div class="card center"><div class="tag">${isTest?'Test · No. '+(N+1)+' · '+nice:isArch?'No. '+(N+1)+' · '+nice:nice}</div>
  <div class="score">${s}/${n}</div><div class="ticks">${ticks}</div><div class="rank">${rank(s)}</div>
  <p class="muted">${isArch?`<a class="inl" href="#" id="moreArch">Play another earlier puzzle</a> or <a class="inl" href="./${ARCH_TAIL}">go back to today's puzzle</a>.`:'<span data-next="Four more rounds in {t}.">Four more rounds tomorrow.</span>'+(ARCH&&TODAY>=1&&!isTest?` Can't wait? <a class="inl" href="#" id="moreArch">Play earlier puzzles</a>.`:'')}</p>
  <button class="primary" id="share">Share</button><button class="ghost" id="copy">Copy result</button>
  <ul class="recap">${items.map((it,k)=>{const [h,m]=recapLine(ROUNDS[k].key,it);return`<li><span>${st.res[k]?'✅':'❌'}</span><span class="h">${esc(h)}</span><span class="m">${esc(m)}</span><span class="flag"><a href="/feedback/?game=roots&type=puzzle&puzzle=${encodeURIComponent((isArch?'No. '+(N+1):nice)+' · '+ROUNDS[k].name+' · '+h)}">Wrong?</a></span></li>`}).join('')}</ul>
  <p class="muted" style="font-size:14px;margin:14px 0 0">Every answer is checked against <a class="inl" href="https://www.etymonline.com" target="_blank" rel="noopener">Etymonline</a>.</p></div>${document.getElementById('xgCards').innerHTML}`;
  $('#share').onclick=()=>{if(navigator.share){navigator.share({text:share}).catch(()=>{})}else{location.href='https://wa.me/?text='+encodeURIComponent(share)}};
  $('#copy').onclick=()=>{try{navigator.clipboard.writeText(share).then(()=>{$('#copy').textContent='Copied'},()=>{})}catch(e){}};
  const more=$('#moreArch');if(more)more.onclick=e=>{e.preventDefault();openArchive()};
}

function openArchive(){
  const list=[];
  for(let k=TODAY-1;k>=0;k--){
    const r=store.get('roots-'+keyOf(k));
    const stx=r&&r.length===4?`<span class="st done">${r.filter(Boolean).length}/4</span>`:'<span class="st">Play →</span>';
    list.push(`<li><a href="?day=${k+1}${ARCH_TAIL}"><span>No. ${k+1} <span class="when">· ${fmt(k,{weekday:'short',day:'numeric',month:'short'})}</span></span>${stx}</a></li>`);
  }
  if(!list.length)list.push('<li class="muted">No earlier puzzles yet. Come back tomorrow.</li>');
  $('#archLine').hidden=true;$('#dots').innerHTML='';
  app.innerHTML=`<div class="card"><div class="q" style="font-size:22px;margin-top:0">Earlier puzzles</div>
  <p class="muted" style="margin:4px 0 0">Missed a day? Every past Roots is here.</p>
  <ul class="archlist">${list.join('')}</ul><a class="primary" href="./${ARCH_TAIL}">Back to today's puzzle</a></div>`;
  window.scrollTo(0,0);
}

if(isTest)$('#test').innerHTML=`<div class="test">Test mode: No. ${N+1} · ${fmt(N,{weekday:'short',day:'numeric',month:'short'})} · results not saved</div>`;
if(ARCH&&TODAY>=1){$('#archFoot').hidden=false;$('#archLink').onclick=e=>{e.preventDefault();openArchive()};}
if(isArch){const l=$('#archLine');l.hidden=false;l.innerHTML=`Earlier puzzle · No. ${N+1} · <a href="./${ARCH_TAIL}">Today's puzzle</a>`;}
const done=!isTest&&store.get('roots-'+dateKey);
// Wait for the page to finish loading: the results screen uses the 'Fancy another?' cards further down.
