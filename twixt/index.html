<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Twixt</title>
<meta name="description" content="A daily prepositions game: on or in, over or above, between or among. Five rounds a day.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://samey.uk/twixt/">
<meta property="og:site_name" content="Twixt">
<meta property="og:title" content="Twixt: the little words that put things in their place">
<meta property="og:description" content="On Skye but in Guernsey. On the bus but in the taxi. Five rounds of prepositions a day.">
<meta property="og:image" content="https://samey.uk/twixt/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<link rel="icon" href="/twixt/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap">
<style>
:root{--bg:#f6faf9;--card:#fff;--ink:#14201f;--muted:#5b6b69;--line:#d9e4e2;--accent:#1f7a80;--deep:#134a50;--good:#2b8a3e;--bad:#c92a2a;--goodbg:#ebfbee;--badbg:#fff0f0;--chip:#eaf2f1;--ball:#e8590c;--head:"Libre Baskerville",Georgia,serif}
@media (prefers-color-scheme:dark){:root{--bg:#0f1515;--card:#182120;--ink:#e6f0ee;--muted:#9fb0ad;--line:#2d3b39;--accent:#63c5cb;--deep:#b5e6e8;--good:#8ce99a;--bad:#ff8787;--goodbg:#173022;--badbg:#3a1a1a;--chip:#1f2c2b;--ball:#ff7a33}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:480px;margin:0 auto;padding:16px 16px 40px;min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
h1{font-family:var(--head);font-weight:700;font-size:30px;margin:0;line-height:1}
h1 svg{width:30px;height:30px;vertical-align:-5px;margin-right:6px}
.pts{font-weight:700;color:var(--deep);font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.tag{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:600}
.kind{font-weight:700;color:var(--accent);font-size:15px;margin:10px 0 8px}
.scene{background:var(--chip);border-radius:12px;padding:6px;color:var(--muted)}
.scene svg{display:block;width:100%;height:auto}
.q{font-family:var(--head);font-size:23px;line-height:1.4;margin:6px 0 4px}
.gap{display:inline-block;min-width:3.2em;border-bottom:2.5px solid var(--accent);text-align:center;color:var(--accent);font-weight:700}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0 0}
.opts button{min-height:54px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);font:700 19px/1.2 var(--head);padding:8px}
.opts button.ok{border-color:var(--good);background:var(--goodbg);color:var(--good)}
.opts button.no{border-color:var(--bad);background:var(--badbg);color:var(--bad)}
.opts button.also{border-color:var(--good);border-style:dashed}
.opts button:disabled{cursor:default}
.dots{display:flex;gap:6px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.ok{background:var(--good)}.dots i.no{background:var(--bad)}.dots i.cur{background:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--deep);outline-offset:2px}
.btns{display:flex;gap:10px;margin-top:14px}
.primary{flex:1;padding:14px;border:0;border-radius:12px;background:var(--deep);color:var(--bg);font-weight:700;min-height:50px}
.why{margin:14px 0 0;font-size:16px;line-height:1.5}
.why b.g{color:var(--good)}.why b.r{color:var(--bad)}
.center{text-align:center}
.rank{font-family:var(--head);font-weight:700;font-size:24px;margin:8px 0 4px;color:var(--accent)}
.squares{font-size:24px;letter-spacing:3px;margin:6px 0 4px}
.muted{color:var(--muted);font-size:15px}
a{color:var(--accent)}
.test{background:var(--chip);border-radius:10px;padding:8px 12px;font-size:14px;margin-bottom:12px}
.ex{margin:10px 0 4px;font-size:15px}.ex summary{cursor:pointer;color:var(--accent);font-weight:600}
.how{margin:8px 0 0;padding-left:20px;color:var(--muted)}
.how li{margin:3px 0}
.recap{list-style:none;padding:0;margin:8px 0 0}
.recap li{border-top:1px solid var(--line);padding:10px 0;font-size:15px}
.recap .a{font-family:var(--head);font-weight:700;color:var(--accent)}
footer{margin-top:18px;text-align:center}
</style>
<link rel="manifest" href="/manifest.webmanifest">
</head>
<body>
<main>
  <header><h1><svg viewBox="0 0 64 64" aria-hidden="true"><rect x="4" y="4" width="56" height="56" rx="12" fill="#134a50"/><rect x="13" y="20" width="9" height="30" rx="2" fill="#b5e6e8"/><rect x="42" y="20" width="9" height="30" rx="2" fill="#b5e6e8"/><circle cx="32" cy="42" r="7" fill="#ff7a33"/></svg>Twixt</h1><span class="pts" id="pts"></span></header>
  <nav class="sy-bar" aria-label="Games"></nav>
  <div id="test"></div>
  <div id="app"></div>
  <footer><p class="muted"><a href="/feedback/?game=twixt">Send feedback</a> · <a href="/support/?game=twixt">Support the games</a></p></footer>
</main>
<script src="data.js"></script>
<script>
// ---- Which day is on screen ----
// ?day=N plays Twixt No. N; #test plays without saving.
// Launched Thu 26 Nov 2026, which is No. 1. DAYS in data.js run Monday first, so WD lines the rounds up
// with the real weekday (Thu to Sat get the tougher rounds; Sunday stays the boss day).
const START=Date.UTC(2026,10,26);
const WD=(new Date(START).getUTCDay()+6)%7;
const dayDate=n=>new Date(START+n*864e5);
const fmt=(n,o)=>dayDate(n).toLocaleDateString('en-GB',Object.assign({timeZone:'UTC'},o));
const keyOf=n=>{const d=dayDate(n);return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0')};
addEventListener('hashchange',()=>location.reload());
const params=new URLSearchParams(location.search);
const now=new Date();
const TODAY=Math.max(0,Math.round((Date.UTC(now.getFullYear(),now.getMonth(),now.getDate())-START)/864e5));
const isTest=location.hash==='#test';
const td=parseInt(params.get('day'),10);
const N=Number.isInteger(td)&&td>=1?td-1:TODAY;
const D=DAYS[(N+WD)%DAYS.length];
const SKEY='twixt-'+keyOf(N);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){if(isTest)return;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const $=s=>document.querySelector(s);
const app=$('#app');

// Each round, filled out: options (shuffled the same for everyone on the day), answer, extras that also score.
function seeded(arr,seed){const a=[...arr];let s=seed;for(let i=a.length-1;i>0;i--){s=(s*9301+49297)%233280;const j=Math.floor(s/233280*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const ROUNDS=D.map((r,i)=>{
  const src=r.p?Object.assign({},SCENES[r.p],r.o?{o:r.o}:{},r.why?{why:r.why}:{}):r;
  return {pic:r.p||null,k:r.p?'Picture round':r.k,q:r.q||null,a:src.o[0],also:src.also||[],why:src.why,o:seeded(src.o,N*7919+i*104729+17)};
});

// ---- Scenes: one orange ball and some simple props ----
const L='stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"';
const ground='<line x1="10" y1="150" x2="290" y2="150" stroke="currentColor" stroke-width="1.5"/>';
const table=`<path d="M100 92h100v8H100z" ${L}/><path d="M110 100v50M190 100v50" stroke="currentColor" stroke-width="4"/>`;
const crate=`<path d="M108 78v72h84V78" ${L}/>`;
const box=(x,y,w,h)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="3" style="fill:var(--chip)" stroke="currentColor" stroke-width="2.5"/>`;
const ball=(x,y)=>`<circle cx="${x}" cy="${y}" r="12" style="fill:var(--ball)"/>`;
const mover=(p,d=2.6)=>`<circle r="12" style="fill:var(--ball)"><animateMotion dur="${d}s" repeatCount="indefinite" path="${p}"/></circle>`;
const flag='<path d="M258 150V70" stroke="currentColor" stroke-width="3"/><path d="M258 72l26 10-26 10z" style="fill:var(--accent)"/>';
const DRAW={
  on:()=>ground+table+ball(150,80),
  under:()=>ground+table+ball(150,138),
  above:()=>ground+table+ball(150,36)+'<path d="M150 52v34" stroke="currentColor" stroke-width="1.5" stroke-dasharray="3 4"/>',
  over:()=>ground+table+mover('M30 138Q150-30 270 138'),
  in:()=>ground+crate+ball(150,138),
  into:()=>ground+crate+mover('M30 138Q100-10 150 138'),
  outof:()=>ground+crate+mover('M150 138Q200-10 270 138'),
  onto:()=>ground+table+mover('M30 138Q70 10 150 80'),
  off:()=>ground+table+mover('M120 80H195Q232 80 245 138'),
  behind:()=>ground+ball(196,138)+box(105,80,95,70),
  infront:()=>ground+box(105,70,95,80)+ball(152,138),
  beside:()=>ground+box(110,80,70,70)+ball(196,138),
  between:()=>ground+box(60,90,60,60)+box(180,90,60,60)+ball(150,138),
  among:()=>ground+[[96,138],[124,138],[152,138],[180,138],[208,138],[110,114],[166,114],[194,114],[124,90],[152,90],[180,90],[152,66]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="12" fill="none" stroke="currentColor" stroke-width="2"/>`).join('')+ball(138,114),
  against:()=>ground+'<rect x="196" y="30" width="14" height="120" style="fill:var(--chip)" stroke="currentColor" stroke-width="2.5"/>'+ball(184,138),
  around:()=>ground+box(125,92,50,58)+mover('M150 158A80 26 0 1 1 150.1 158',3.2),
  through:()=>ground+'<path d="M150 70A12 38 0 0 0 150 146" stroke="currentColor" stroke-width="3" fill="none" opacity=".45"/>'+mover('M20 108H280')+'<path d="M150 70A12 38 0 0 1 150 146" stroke="currentColor" stroke-width="3" fill="none"/><path d="M150 146v4" stroke="currentColor" stroke-width="3"/>',
  across:()=>'<path d="M10 120H100V160M200 160V120H290" '+L+'/><path d="M100 140q12-6 25 0t25 0 25 0 25 0" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="M100 120h100" stroke="currentColor" stroke-width="4"/>'+mover('M30 108H270'),
  along:()=>ground+[50,90,130,170,210,250].map(x=>`<path d="M${x} 150V95" stroke="currentColor" stroke-width="3"/>`).join('')+'<path d="M40 108h220M40 130h220" stroke="currentColor" stroke-width="2"/>'+mover('M60 138H240',3),
  up:()=>'<path d="M20 150H60L240 60H290" '+L+'/>'+mover('M66 136L232 53'),
  down:()=>'<path d="M10 60H60L240 150H290" '+L+'/>'+mover('M66 47L232 130'),
  towards:()=>ground+flag+mover('M30 138H190'),
  past:()=>ground+'<path d="M150 150V40" stroke="currentColor" stroke-width="4"/><circle cx="150" cy="40" r="9" fill="none" stroke="currentColor" stroke-width="2.5"/>'+mover('M30 138H270')
};
const scene=k=>`<div class="scene"><svg viewBox="0 0 300 170" role="img" aria-label="Where is the orange ball?">${DRAW[k]()}</svg></div>`;

let st=store.get(SKEY)||{picks:[],at:0,done:false};
const save=()=>store.set(SKEY,st);
const score=()=>st.picks.filter((p,i)=>p===ROUNDS[i].a||ROUNDS[i].also.includes(p)).length;
const right=i=>st.picks[i]===ROUNDS[i].a||ROUNDS[i].also.includes(st.picks[i]);
const tagLine=()=>`${isTest?'Test · ':''}No. ${N+1} · ${fmt(N,{weekday:'short',day:'numeric',month:'short'})}`;
const howTo=`<details class="ex"><summary>How to play</summary><ol class="how">
  <li>Five rounds a day, all about the little words that put things in their place.</li>
  <li><b>Picture rounds:</b> where's the orange ball? Pick the word that fits.</li>
  <li><b>Sentence rounds:</b> fill the gap. Some have more than one right answer (British and American, say): any right answer scores.</li>
  <li>One go per round. It gets trickier through the week, and Sunday is a boss day: five sentences where two answers both look right.</li></ol></details>`;
const flagLink=i=>`<a href="/feedback/?game=twixt&type=puzzle&puzzle=${encodeURIComponent('No. '+(N+1)+' · round '+(i+1))}">Tell us</a>`;
const fillGap=(q,w,cls)=>esc(q).replace('___',`<span class="gap"${cls?` style="color:var(--${cls})"`:''}>${w?esc(w):'&nbsp;'}</span>`);

function round(){
  const i=st.at,R=ROUNDS[i],answered=st.picks.length>i;
  const p=st.picks[i],ok=answered&&right(i);
  $('#pts').innerHTML=`<span class="dots" aria-label="Round ${i+1} of 5">${ROUNDS.map((_,j)=>`<i class="${j<st.picks.length?(right(j)?'ok':'no'):j===i?'cur':''}"></i>`).join('')}</span>`;
  let why='';
  if(answered){
    why=`<p class="why" role="status">${ok?'<b class="g">Spot on.</b>':`<b class="r">Not quite: it's ${esc(R.a)}${R.also.length?' (or '+R.also.map(esc).join(', ')+')':''}.</b>`} ${esc(R.why)}</p>`;
  }
  app.innerHTML=`<div class="card">
    <div class="tag">${tagLine()} · Round ${i+1} of 5${(N+WD)%7===6?' · Boss day':''}</div>
    ${i===0&&!answered?howTo:''}
    <div class="kind">${esc(R.k)}</div>
    ${R.pic?scene(R.pic):`<p class="q">${fillGap(R.q,answered?p:'',answered?(ok?'good':'bad'):'')}</p>`}
    <div class="opts">${R.o.map(o=>{let c='';if(answered){if(o===R.a||(R.also.includes(o)&&o===p))c='ok';else if(R.also.includes(o))c='also';else if(o===p)c='no'}
      return `<button class="${c}" data-o="${esc(o)}"${answered?' disabled':''}>${esc(o)}</button>`}).join('')}</div>
    ${why}
    ${answered?`<div class="btns"><button class="primary" id="nx">${i<4?'Next round':'See how you did'}</button></div>`:''}
  </div>`;
  app.querySelectorAll('.opts button').forEach(b=>b.onclick=()=>{if(st.picks.length>i)return;st.picks.push(b.dataset.o);save();round();$('#nx').focus({preventScroll:true})});
  if(answered)$('#nx').onclick=()=>{if(i===4)st.done=true;else st.at++;save();go()};
}

function rank(t){return['All over the place','Out on a limb','Getting there','On the right lines','Up to scratch','Spot on'][t]}
function end(){
  const t=score();
  $('#pts').textContent=t+'/5';
  const sq=ROUNDS.map((_,i)=>right(i)?'🟩':'🟥').join('');
  if(!isTest&&N===TODAY)(window.SameySetQ=window.SameySetQ||[]).push(['twixt',t+'/5']);
  const share=`Twixt No. ${N+1}\n${sq}\n${t}/5 ${rank(t)}\nYour go: https://samey.uk/twixt/ #sameyuk`;
  app.innerHTML=`<div class="card center">
    <div class="tag">${tagLine()}</div>
    <div class="rank">${t}/5 · ${rank(t)}</div>
    <div class="squares" aria-label="${t} out of 5">${sq}</div>
    <div class="btns"><button class="primary" id="share">Share</button></div>
    <p class="muted"><span data-next="Next Twixt in {t}.">Five new rounds tomorrow.</span></p>
    <p class="muted">All the games are free and ad-free, made by one librarian in Canterbury. Enjoyed today's? <a href="https://ko-fi.com/playtheroute" target="_blank" rel="noopener" style="font-weight:700;white-space:nowrap">☕ Buy me a coffee</a></p>
  </div>
  <div class="card" style="margin-top:14px"><div class="tag">Today's rounds</div>
    <ul class="recap">${ROUNDS.map((R,i)=>`<li>${right(i)?'🟩':'🟥'} <b>${esc(R.k)}:</b> ${R.pic?`the ball goes <span class="a">${esc(R.a)}</span>`:fillGap(R.q,R.a)}${R.also.length?` <span class="muted">(or ${R.also.map(esc).join(', ')})</span>`:''}<br><span class="muted">${esc(R.why)}</span></li>`).join('')}</ul>
    <p class="muted" style="margin-top:8px">Think one of today's is wrong? ${flagLink(0).replace('round 1','today')}.</p>
  </div>
  <div class="xg" data-sy-cards></div>`;
  $('#share').onclick=()=>{if(navigator.share){navigator.share({text:share}).catch(()=>{});return}try{navigator.clipboard.writeText(share).then(()=>{$('#share').textContent='Copied'})}catch(e){}};
}

function go(){if(st.done)return end();round()}
if(isTest)$('#test').innerHTML=`<div class="test">Test mode: No. ${N+1} · results not saved · <a href="?day=${N+2}#test">Next day</a></div>`;
go();
</script>
<script src="/daily.js"></script>

</body>
</html>
