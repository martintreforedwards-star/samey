<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rizz</title>
<meta name="description" content="A daily game of brand-new words: what they mean, where they came from, and which one we made up.">
<link rel="icon" href="/rizz/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/rizz/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:url" content="https://samey.uk/rizz/">
<meta property="og:site_name" content="Rizz">
<meta property="og:title" content="Rizz: the new words game">
<meta property="og:description" content="Five quick rounds a day on the newest words in English.">
<meta property="og:image" content="https://samey.uk/rizz/og-image.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&display=swap">
<style>
:root{--bg:#f3f5ef;--card:#fff;--ink:#14171f;--muted:#5b6170;--line:#dde2d6;--accent:#2b8a3e;--on-accent:#fff;--pop:#a9e34b;--good:#2b8a3e;--bad:#c92a2a;--goodbg:#ebfbee;--badbg:#fff5f5;--chip:#eef3e6;--head:"Bricolage Grotesque",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#0f1214;--card:#181c20;--ink:#eef1ea;--muted:#9aa3a0;--line:#2c3330;--accent:#a9e34b;--on-accent:#14171f;--pop:#a9e34b;--good:#8ce99a;--bad:#ff8787;--goodbg:#173022;--badbg:#3a1f22;--chip:#222a24}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:480px;margin:0 auto;padding:16px 16px 40px;min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
h1{font-family:var(--head);font-weight:800;font-size:34px;margin:0;line-height:1;letter-spacing:-1px}
h1 svg{width:28px;height:28px;vertical-align:-4px;margin-right:6px}
.dots{display:flex;gap:6px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dot.cur{background:var(--ink)}.dot.ok{background:var(--good)}.dot.no{background:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.tag{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:600}
.q{font-size:19px;font-weight:600;margin:6px 0 4px}
.entry{border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:14px}
.word{font-family:var(--head);font-weight:800;font-size:clamp(34px,10vw,46px);line-height:1.05;margin:6px 0 4px;overflow-wrap:anywhere;letter-spacing:-.5px}
.word mark{background:linear-gradient(transparent 62%,color-mix(in srgb,var(--pop) 70%,transparent) 62%);color:inherit;padding:0 2px}
.gloss{color:var(--muted);font-size:16px}
.opts{display:grid;gap:10px;margin-top:14px}
.opts.two{grid-template-columns:1fr 1fr}
button{font:inherit;color:inherit;cursor:pointer}
.opt{text-align:left;padding:14px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);min-height:52px}
.opts.two .opt{text-align:center;font-family:var(--head);font-weight:700;font-size:22px}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt:focus-visible,.primary:focus-visible,.ghost:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.opt.right{border-color:var(--good);background:var(--goodbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt.right::after{content:" ✓";font-weight:700}.opt.wrong::after{content:" ✗";font-weight:700}
.opt.dim{opacity:.55}
.opt[disabled]{cursor:default}
.opt .w{display:block;font-family:var(--head);font-weight:700;font-size:20px;line-height:1.2}
.opt .m{display:block;color:var(--muted);font-size:15px;margin-top:2px}
.opt .src{display:none;font-size:13px;color:var(--muted);margin-top:4px}
.opt.shown .src{display:block}
.opts.two.words .opt{font-size:18px;font-family:inherit;font-weight:600}
.opts.long .opt{font-size:16px;line-height:1.35}
.word .say{display:block;font-size:clamp(22px,6.4vw,28px);line-height:1.25;letter-spacing:0}
.reveal{margin-top:16px;padding:14px 16px;border-radius:12px;background:var(--chip)}
.reveal b{display:block;margin-bottom:4px}
.reveal .more{display:block;margin-top:8px;font-size:14px}
.reveal .more a{color:inherit}
.primary{display:block;width:100%;margin-top:16px;padding:14px;border:0;border-radius:12px;background:var(--accent);color:var(--on-accent);font-weight:600}
.ghost{display:block;width:100%;margin-top:10px;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:none;font-weight:600}
.center{text-align:center}
.ticks{font-size:34px;letter-spacing:4px;margin:10px 0}
.score{font-family:var(--head);font-weight:800;font-size:52px;margin:4px 0;line-height:1}
.rank{font-size:20px;font-weight:700;color:var(--accent)}
.muted{color:var(--muted)}
ul.rounds{padding-left:20px;margin:10px 0 0}
ul.rounds li{margin-bottom:4px}
.recap{list-style:none;padding:0;margin:16px 0 0;display:grid;gap:12px;text-align:left;border-top:1px solid var(--line);padding-top:14px}
.recap li{display:grid;grid-template-columns:auto 1fr;gap:2px 10px}
.recap .h{font-family:var(--head);font-weight:700;font-size:20px;line-height:1.2}
.recap .m{grid-column:2;color:var(--muted);font-size:15px}
.recap .flag{grid-column:2;font-size:13px;color:var(--muted)}
.recap .flag a{color:inherit}
footer{margin-top:24px;text-align:center;font-size:15px}
footer a{color:var(--accent);text-decoration:none;margin:0 6px}
footer .games{display:flex;flex-wrap:wrap;justify-content:center;gap:2px 0;margin:0}
footer .games .muted{flex-basis:100%}
.test{font-size:13px;color:var(--bad);text-align:center;margin-bottom:8px}
.archline{font-size:15px;color:var(--muted);margin:-4px 0 12px}
.archline a,.card a.inl{color:var(--accent);font-weight:600}
.archlist{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:8px}
.archlist a{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;min-height:52px;border:1.5px solid var(--line);border-radius:12px;color:inherit;text-decoration:none;font-weight:600}
.archlist a:hover{border-color:var(--ink)}
.archlist .when{font-weight:400;color:var(--muted);font-size:15px}
.archlist .st{font-size:15px;white-space:nowrap;color:var(--muted)}
.archlist .st.done{color:var(--good)}
a.primary{text-align:center;text-decoration:none}

/* Cross-game cards (same design as Samey's result cards) */
.card + .xg{margin-top:14px}
.xg{display:flex;flex-direction:column;gap:10px;text-align:left;--xg-s:var(--surface,var(--card,#fff))}
.xg .xg-head{text-align:left;margin:4px 0 0;font-size:.92rem;font-weight:700;color:var(--muted)}
.xg-card{--c:#1f7a6d;display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:10px;background:color-mix(in srgb,var(--c) 12%,var(--xg-s));border:2px solid var(--c);color:var(--ink);text-decoration:none;min-height:44px}
.xg-card:hover .xg-arrow{transform:translateX(3px)}
.xg-card:focus-visible{outline:3px solid var(--c);outline-offset:2px}
.xg-icon{flex:none;width:48px;height:48px}
.xg-text{display:flex;flex-direction:column;gap:1px;min-width:0}
.xg-new{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:color-mix(in srgb,var(--c) 60%,var(--ink))}
.xg-title{font-family:var(--display,inherit);font-weight:800;font-size:1.3rem;line-height:1.1}
.xg-sub{font-size:.9rem;color:var(--muted)}
.xg-arrow{margin-left:auto;font-size:1.4rem;font-weight:700;flex:none;color:color-mix(in srgb,var(--c) 60%,var(--ink));transition:transform .15s}
.xg-samey{--c:#1f7a6d}.xg-spinonym{--c:#d99a1e}.xg-dotty{--c:#E2405A}.xg-syntaxed{--c:#3B5BDB}.xg-passe{--c:#7B3F73}.xg-natter{--c:#B0186A}.xg-roots{--c:#8A5A2B}.xg-phoney{--c:#6741d9}.xg-rhymey{--c:#0b7285}.xg-babel{--c:#c2410c}.xg-rizz{--c:#2b8a3e}
@media (prefers-reduced-motion:no-preference){.reveal{animation:up .2s ease-out}@keyframes up{from{transform:translateY(6px);opacity:.4}to{transform:none;opacity:1}}}
</style>
</head>
<body>
<main>
  <header><h1><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M30 6c2 14 8 20 22 22-14 2-20 8-22 22-2-14-8-20-22-22 14-2 20-8 22-22z" fill="var(--pop)"/><path d="M51 40c1 6 3 8 9 9-6 1-8 3-9 9-1-6-3-8-9-9 6-1 8-3 9-9z" fill="currentColor"/></svg>Rizz</h1><div class="dots" id="dots"></div></header>
  <nav class="sy-bar" aria-label="Games"></nav>
  <div id="test"></div>
  <p class="archline" id="archLine" hidden></p>
  <div id="app"></div>
  <footer><p class="games"><span class="muted">More games:</span><a href="/">Samey</a><a href="/spinonym/">Spinonym</a><a href="/dotty/">Dotty</a><a href="/syntaxed/">Syntaxed</a><a href="/passe/">Passé</a><a href="/natter/">Natter</a><a href="/roots/">Roots</a><a href="/babel/">Babel</a><a href="/rhymey/">Rhymey</a><a href="/phoney/">Phoney</a></p>
  <p class="muted" style="margin-top:10px"><span id="archFoot" hidden><a href="#" id="archLink">Earlier puzzles</a> · </span><a href="/feedback/?game=rizz">Send feedback</a> · <a href="/support/?game=rizz">Support us</a></p></footer>
</main>
<script src="data.js"></script>
<script>
// ---- Schedule ----
// Rizz No. 1 is START. Every day has five rounds, picked from ten round types:
//  · Monday to Saturday: five of the nine everyday rounds.
//  · Sunday: four of them, then Translate it as the finale.
// The nine take turns (see CYCLE), so each one comes up about every other day. Each round type works through its own
// list in data.js and starts again from the top when it runs out, so keep adding words (shortest lists run out first).
// Launched 29 Oct 2026. START is No. 1: Rizz
const START=Date.UTC(2026,9,29);
const dayDate=n=>new Date(START+n*864e5);   // read with UTC getters
const keyOf=n=>{const d=dayDate(n);return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0')};
const fmt=(n,o)=>dayDate(n).toLocaleDateString('en-GB',Object.assign({timeZone:'UTC'},o));
const T={
  spell:{name:'Spell it out',blurb:'What do the letters stand for?',list:SPELL,q:()=>'What does it stand for?'},
  mean:{name:"What's it mean?",blurb:'Pick the real meaning of a new word',list:MEAN,q:()=>'What does it mean?'},
  blend:{name:'Blend it',blurb:'Which two words were squashed together?',list:BLEND,q:()=>'Which two words make it up?'},
  trick:{name:'Old word, new trick',blurb:"What's the new meaning of an old word?",list:TRICK,q:it=>`It used to mean ${it.old}. What does it mean now?`},
  use:{name:'Use it right',blurb:'Only one sentence gets the word right',list:USE,q:()=>'Which sentence uses it properly?'},
  source:{name:'Where did it come from?',blurb:'What was the word born in?',list:SOURCE,q:()=>'Where was it born?',two:true},
  older:{name:'Older than you think',blurb:'When was it first written down?',list:OLDER,q:()=>'When was it first written down?',two:true},
  fake:{name:'Real or rizz?',blurb:'Spot the word we made up',list:FAKE,q:()=>'Three of these are in the dictionary. Which one did we make up?'},
  when:{name:'When did it land?',blurb:'Guess the year it was Word of the Year',list:WHEN,q:it=>`Which year was it ${esc(it.by)}'s Word of the Year?`,two:true},
  translate:{name:'Translate it',blurb:'Sunday special: say it in plain English',list:TRANSLATE,q:()=>'What does it mean in plain English?'}
};
const PLAY_ORDER=['spell','mean','blend','trick','use','source','older','fake','when','translate'];   // easier rounds first
const CYCLE=['mean','blend','when','use','spell','fake','trick','older','source'];
const isSunday=n=>dayDate(n).getUTCDay()===0;
function plan(n){
  let p=0;const seen={};let today=null;
  for(let d=0;d<=n;d++){
    const take=isSunday(d)?4:5,keys=[];
    for(let i=0;i<take;i++)keys.push(CYCLE[(p+i)%CYCLE.length]);
    p+=take;if(isSunday(d))keys.push('translate');
    if(d===n)today=keys.map(k=>({k,c:seen[k]||0}));
    keys.forEach(k=>seen[k]=(seen[k]||0)+1);
  }
  // Pick each round's item. If a word is already in another of today's rounds, use the next one in that list instead.
  const used=new Set(),norm=s=>String(s).toLowerCase().replace(/[^a-z0-9]/g,'');
  const wordsOf=(k,it)=>k==='fake'?[...it.r.map(x=>x[0]),it.k[0]]:k==='translate'?[]:[it.w];
  return today.sort((x,y)=>PLAY_ORDER.indexOf(x.k)-PLAY_ORDER.indexOf(y.k)).map(({k,c})=>{
    const L=T[k].list;let it=L[c%L.length];
    for(let j=1;j<L.length&&wordsOf(k,it).some(w=>used.has(norm(w)));j++)it=L[(c+j)%L.length];
    wordsOf(k,it).forEach(w=>used.add(norm(w)));
    return{key:k,...T[k],it};
  });
}

// ---- Which day is on screen ----
// samey.uk/rizz/#test plays today without saving; add ?day=N for Rizz No. N (any day, past or future).
// ?day=N on its own opens an earlier puzzle from the archive.
const ARCHIVE_ON=true;
addEventListener('hashchange',()=>location.reload());
const params=new URLSearchParams(location.search);
const now=new Date();
const TODAY=Math.max(0,Math.round((Date.UTC(now.getFullYear(),now.getMonth(),now.getDate())-START)/864e5));
const isTest=location.hash==='#test';
const ARCH=ARCHIVE_ON||isTest||location.hash==='#archive';
const ARCH_TAIL=ARCHIVE_ON?(isTest?'#test':''):(isTest?'#test':'#archive');
const td=parseInt(params.get('day'),10);
const N=Number.isInteger(td)&&td>=1&&(isTest||(ARCH&&td<=TODAY))?td-1:TODAY;
const isArch=!isTest&&N<TODAY;
const dateKey=keyOf(N);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ROUNDS=plan(N);
const items=ROUNDS.map(r=>r.it);
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

// Seeded shuffle so everyone sees the same option order on the same day
function rng(seed){let h=1779033703^seed.length;for(let i=0;i<seed.length;i++){h=Math.imul(h^seed.charCodeAt(i),3432918353);h=h<<13|h>>>19}return function(){h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);h^=h>>>16;return(h>>>0)/4294967296}}
function order(n,seed){const r=rng(seed),a=[...Array(n).keys()];for(let i=n-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

const $=s=>document.querySelector(s);
const app=$('#app');
let st={i:0,res:[]};
const lc=s=>s.charAt(0).toLowerCase()+s.slice(1);

function dots(){$('#dots').innerHTML=items.map((_,k)=>`<div class="dot ${st.res[k]===true?'ok':st.res[k]===false?'no':k===st.i?'cur':''}"></div>`).join('')}

function intro(){
  app.innerHTML=`<div class="card"><div class="tag">${isArch||isTest?fmt(N,{weekday:'long',day:'numeric',month:'long'}):'Today'}</div>
  <div class="q">Five quick rounds on the newest words in English.</div>
  <p class="muted" style="margin:6px 0 0">One go at each. The rounds change every day${isSunday(N)?', and Sundays end with a special':''}. Here's today's mix:</p>
  <ul class="rounds">${ROUNDS.map(r=>`<li><b>${r.name}</b> · ${r.blurb}</li>`).join('')}</ul>
  <button class="primary" id="go">Play</button></div>`;
  $('#go').onclick=()=>{st={i:0,res:[]};round()};
  dots();
}

function round(){
  const R=ROUNDS[st.i],k=R.key,it=R.it;dots();
  // Option 0 is always the right answer; the order on screen is shuffled.
  let opts,head;
  if(k==='fake'){opts=[it.k,...it.r].map(x=>`<span class="w">${esc(x[0])}</span><span class="m">${esc(x[1])}</span>${x[2]?`<span class="src">Added: ${esc(x[2])}</span>`:''}`);head='Real or <mark>rizz</mark>?'}
  else{opts=[it.a,...it.f].map(esc);head=k==='translate'?`<span class="say">“${esc(it.w)}”</span>`:`<mark>${esc(it.w)}</mark>`}
  let ord=order(4,dateKey+'|'+k+'|'+(k==='fake'?it.k[0]:it.w));
  if(k==='when'||k==='older')ord=[...ord].sort((x,y)=>parseInt(opts[x])-parseInt(opts[y]));   // dates read best in order
  app.innerHTML=`<div class="card"><div class="entry"><div class="tag">Round ${st.i+1} · ${R.name}</div>
  <div class="word">${head}</div></div><div class="q">${R.q(it)}</div>
  <div class="opts${R.two?' two':''}${k==='source'?' words':''}${k==='use'||k==='translate'?' long':''}">${ord.map(x=>`<button class="opt" data-k="${x}">${opts[x]}</button>`).join('')}</div><div id="after" aria-live="polite"></div></div>`;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const ok=+b.dataset.k===0;
    app.querySelectorAll('.opt').forEach(x=>{x.disabled=true;x.classList.add('shown');if(+x.dataset.k===0)x.classList.add('right');else if(x!==b)x.classList.add('dim')});
    if(!ok)b.classList.add('wrong');
    const W=`<i>${esc(k==='fake'?it.k[0]:it.w)}</i>`;
    const story={
      mean:()=>`${W}: ${esc(lc(it.a))}. ${it.o}`,
      when:()=>`${W} was ${esc(it.by)}'s Word of the Year in ${it.a}. ${it.o}`,
      fake:()=>`We made up ${W}. The other three are real, and each one shows where it was added.`,
      blend:()=>`${W} = ${esc(it.a)}. ${it.o}`,
      trick:()=>`${W} used to mean ${esc(it.old)}. Now it can also mean ${esc(lc(it.a))}. ${it.o}`,
      source:()=>it.o,
      older:()=>`${W} was first written down in the ${it.a}. ${it.o}`,
      use:()=>it.o,
      spell:()=>`${W} stands for <i>${esc(it.a)}</i>. ${it.o}`,
      translate:()=>it.o
    }[k]();
    after(ok,story,k==='fake'?(ok?'Spotted it.':'Not quite. That one is real.'):null);
  });
}

function after(ok,html,head){
  st.res[st.i]=ok;dots();
  const last=st.i===items.length-1;
  $('#after').innerHTML=`<div class="reveal"><b>${head||(ok?'Correct.':'Not quite. The right one is highlighted.')}</b>${html}</div><button class="primary" id="next">${last?'See results':'Next round'}</button>`;
  const nx=$('#next');
  nx.onclick=()=>{if(last){if(!isTest)store.set('rizz-'+dateKey,st.res);results()}else{st.i++;round();window.scrollTo(0,0)}};
  nx.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function rank(s){return['Out of the Loop','Late Adopter','Lowkey Learning','Main Character','Trendsetter','Unspoken Rizz'][s]}
function recapLine(k,it){
  if(k==='fake')return[it.k[0],'the one we made up'];
  if(k==='when')return[it.w,`${it.by}, ${it.a}`];
  if(k==='trick')return[it.w,`now: ${lc(it.a)}`];
  if(k==='older')return[it.w,`first written down in the ${it.a}`];
  if(k==='source')return[it.w,`born in: ${lc(it.a)}`];
  if(k==='use')return[it.w,it.a];
  if(k==='translate')return['Sunday special',it.a];
  return[it.w,it.a];
}

function results(){
  st.i=items.length;dots();
  const s=st.res.filter(Boolean).length,n=items.length;
  const ticks=st.res.map(x=>x?'✅':'❌').join('');
  if(!isTest&&!isArch)(window.SameySetQ=window.SameySetQ||[]).push(['rizz',s+'/'+n]);
  const nice=fmt(N,{weekday:'short',day:'numeric',month:'short'});
  const share=`Rizz No. ${N+1}${isArch?' (archive)':''}\n${s}/${n} ${ticks}\n${rank(s)}\nYour go: https://samey.uk/rizz/ #sameyuk`;
  app.innerHTML=`<div class="card center"><div class="tag">${isTest?'Test · No. '+(N+1)+' · '+nice:isArch?'No. '+(N+1)+' · '+nice:nice}</div>
  <div class="score">${s}/${n}</div><div class="ticks">${ticks}</div><div class="rank">${rank(s)}</div>
  <p class="muted">${isArch?`<a class="inl" href="#" id="moreArch">Play another earlier puzzle</a> or <a class="inl" href="./${ARCH_TAIL}">go back to today's puzzle</a>.`:'<span data-next="A new mix of rounds in {t}.">A new mix of rounds tomorrow.</span>'+(ARCH&&TODAY>=1&&!isTest?` Can't wait? <a class="inl" href="#" id="moreArch">Play earlier puzzles</a>.`:'')}</p>
  <button class="primary" id="share">Share</button><button class="ghost" id="copy">Copy result</button>
  <ul class="recap">${items.map((it,k)=>{const [h,m]=recapLine(ROUNDS[k].key,it);return`<li><span>${st.res[k]?'✅':'❌'}</span><span class="h">${esc(h)}</span><span class="m">${esc(m)}</span><span class="flag"><a href="/feedback/?game=rizz&type=puzzle&puzzle=${encodeURIComponent((isArch?'No. '+(N+1):nice)+' · '+ROUNDS[k].name+' · '+h)}">Wrong?</a></span></li>`}).join('')}</ul></div>${document.getElementById('xgCards').innerHTML}`;
  $('#share').onclick=()=>{if(navigator.share){navigator.share({text:share}).catch(()=>{})}else{location.href='https://wa.me/?text='+encodeURIComponent(share)}};
  $('#copy').onclick=()=>{try{navigator.clipboard.writeText(share).then(()=>{$('#copy').textContent='Copied'},()=>{})}catch(e){}};
  const more=$('#moreArch');if(more)more.onclick=e=>{e.preventDefault();openArchive()};
}

function openArchive(){
  const list=[];
  for(let k=TODAY-1;k>=0;k--){
    const r=store.get('rizz-'+keyOf(k));
    const stx=r&&r.length===5?`<span class="st done">${r.filter(Boolean).length}/5</span>`:'<span class="st">Play →</span>';
    list.push(`<li><a href="?day=${k+1}${ARCH_TAIL}"><span>No. ${k+1} <span class="when">· ${fmt(k,{weekday:'short',day:'numeric',month:'short'})}</span></span>${stx}</a></li>`);
  }
  if(!list.length)list.push('<li class="muted">No earlier puzzles yet. Come back tomorrow.</li>');
  $('#archLine').hidden=true;$('#dots').innerHTML='';
  app.innerHTML=`<div class="card"><div class="q" style="font-size:22px;margin-top:0">Earlier puzzles</div>
  <p class="muted" style="margin:4px 0 0">Missed a day? Every past Rizz is here.</p>
  <ul class="archlist">${list.join('')}</ul><a class="primary" href="./${ARCH_TAIL}">Back to today's puzzle</a></div>`;
  window.scrollTo(0,0);
}

if(isTest)$('#test').innerHTML=`<div class="test">Test mode: No. ${N+1} · ${fmt(N,{weekday:'short',day:'numeric',month:'short'})} · results not saved</div>`;
if(ARCH&&TODAY>=1){$('#archFoot').hidden=false;$('#archLink').onclick=e=>{e.preventDefault();openArchive()};}
if(isArch){const l=$('#archLine');l.hidden=false;l.innerHTML=`Earlier puzzle · No. ${N+1} · <a href="./${ARCH_TAIL}">Today's puzzle</a>`;}
const done=!isTest&&store.get('rizz-'+dateKey);
// Wait for the page to finish loading: the results screen uses the 'Fancy another?' cards further down.
document.addEventListener('DOMContentLoaded',()=>{if(done&&done.length===items.length){st.res=done;results()}else intro();});
</script>
