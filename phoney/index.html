<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phoney</title>
<meta name="description" content="A daily pronunciation game: silent letters, tricky place names, shifting stress and London glottal stops.">
<link rel="icon" href="/phoney/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/phoney/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:url" content="https://samey.uk/phoney/">
<meta property="og:site_name" content="Phoney">
<meta property="og:title" content="Phoney: the pronunciation game">
<meta property="og:description" content="Quick daily rounds on how words really sound. Is it LEM-ster or LEE-oh-min-ster?">
<meta property="og:image" content="https://samey.uk/phoney/og-image.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,800;1,9..144,400;1,9..144,500&display=swap">
<style>
:root{--bg:#f5f3fb;--card:#fff;--ink:#18151f;--muted:#635d70;--line:#e2ddef;--accent:#6741d9;--on-accent:#fff;--pop:#9775fa;--good:#2b8a3e;--bad:#c92a2a;--goodbg:#ebfbee;--badbg:#fff5f5;--chip:#efeafc;--head:"Fraunces",Georgia,serif;--ipa:"Charis SIL","Doulos SIL","Gentium Plus","Noto Sans","Segoe UI","Lucida Sans Unicode","DejaVu Sans",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#121016;--card:#1b1820;--ink:#efecf5;--muted:#a29cb0;--line:#2f2a38;--accent:#b197fc;--on-accent:#121016;--pop:#9775fa;--good:#8ce99a;--bad:#ff8787;--goodbg:#173022;--badbg:#3a1f22;--chip:#241f2e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:480px;margin:0 auto;padding:16px 16px 40px;min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
h1{font-family:var(--head);font-weight:800;font-size:34px;margin:0;line-height:1;letter-spacing:-.5px}
h1 svg{width:28px;height:28px;vertical-align:-3px;margin-right:6px}
.dots{display:flex;gap:6px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dot.cur{background:var(--ink)}.dot.ok{background:var(--good)}.dot.no{background:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.tag{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:600}
.q{font-size:19px;font-weight:600;margin:6px 0 4px}
.entry{border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:14px}
.big-q{font-family:var(--head);font-weight:800;font-size:28px;line-height:1.15;margin:6px 0 2px}
.place{font-family:var(--head);font-weight:800;font-size:34px;line-height:1.1;margin:10px 0 0;overflow-wrap:anywhere}
.sub{font-size:15px;color:var(--muted);margin-top:2px}
.sent{font-family:var(--head);font-style:italic;font-size:22px;line-height:1.45;margin:10px 0 4px}
.sent b{font-style:normal;font-weight:800;color:var(--accent)}
.ipa{font-family:var(--ipa);font-size:36px;font-weight:400;letter-spacing:.5px;margin:12px 0 4px;text-align:center}
.ipa .sl{color:var(--muted)}
.opts{display:grid;gap:10px;margin-top:14px}
.opts.two{grid-template-columns:1fr 1fr}
button{font:inherit;color:inherit;cursor:pointer}
.opt{text-align:left;padding:14px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);min-height:52px}
.opts.two .opt{text-align:center;font-family:var(--head);font-weight:600;font-size:22px}
.opts.resp .opt{font-weight:600;letter-spacing:.5px;font-size:19px}
.opt u{text-decoration:underline;text-decoration-color:var(--pop);text-decoration-thickness:3px;text-underline-offset:5px}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt:focus-visible,.primary:focus-visible,.ghost:focus-visible,.let:focus-visible,.tb:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.opt.right{border-color:var(--good);background:var(--goodbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt.right::after{content:" ✓";font-weight:700}.opt.wrong::after{content:" ✗";font-weight:700}
.opt.dim{opacity:.55}
.opt[disabled]{cursor:default}
/* Silent partner */
.lets{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:18px 0 6px}
.let{font-family:var(--head);font-weight:600;font-size:28px;min-width:44px;min-height:56px;padding:6px 8px;border-radius:10px;border:1.5px solid var(--line);background:var(--card)}
.let:hover:not([disabled]){border-color:var(--accent)}
.let[disabled]{cursor:default}
.let.right{border-color:var(--good);background:var(--goodbg);color:var(--good);text-decoration:line-through;text-decoration-thickness:3px}
.let.wrong{border-color:var(--bad);background:var(--badbg)}
/* Spot the stop */
.phrase{font-family:var(--head);font-size:26px;font-weight:600;line-height:1.3;display:flex;flex-wrap:wrap;gap:10px 14px;margin:18px 0 8px}
.wd{display:inline-flex;align-items:center;white-space:nowrap}
.tb{font-family:var(--head);font-size:26px;font-weight:600;min-width:34px;min-height:46px;padding:2px 6px;margin:0 1px;border-radius:8px;border:1.5px dashed var(--accent);background:var(--card);color:var(--accent)}
.tb.on{background:var(--accent);color:var(--on-accent);border-style:solid}
.tb[disabled]{cursor:default}
.tb.hit{background:var(--goodbg);border:1.5px solid var(--good);color:var(--good)}
.tb.extra{background:var(--badbg);border:1.5px solid var(--bad);color:var(--bad)}
.tb.miss{border:2px dashed var(--good);color:var(--good)}
.tb.keep{border:1.5px solid var(--line);color:var(--ink)}
.pat{font-family:var(--ipa);font-size:20px;margin:0 0 6px}
.count{font-size:15px;color:var(--muted)}
.reveal{margin-top:16px;padding:14px 16px;border-radius:12px;background:var(--chip)}
.reveal b{display:block;margin-bottom:4px}
.reveal .ipa-i{font-family:var(--ipa)}
.primary{display:block;width:100%;margin-top:16px;padding:14px;border:0;border-radius:12px;background:var(--accent);color:var(--on-accent);font-weight:600}
.primary[disabled]{opacity:.45;cursor:default}
.ghost{display:block;width:100%;margin-top:10px;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:none;font-weight:600}
.center{text-align:center}
.ticks{font-size:34px;letter-spacing:4px;margin:10px 0}
.score{font-family:var(--head);font-weight:800;font-size:52px;margin:4px 0;line-height:1}
.rank{font-size:20px;font-weight:700;color:var(--accent)}
.muted{color:var(--muted)}
ul.rounds{padding-left:20px;margin:10px 0 0}
ul.rounds li{margin-bottom:4px}
.recap{list-style:none;padding:0;margin:16px 0 0;display:grid;gap:12px;text-align:left;border-top:1px solid var(--line);padding-top:14px}
.recap li{display:grid;grid-template-columns:auto 1fr;gap:2px 10px}
.recap .h{font-family:var(--head);font-weight:600;font-size:20px;line-height:1.2}
.recap .m{grid-column:2;color:var(--muted);font-size:15px}
.recap .flag{grid-column:2;font-size:13px;color:var(--muted)}
.recap .flag a{color:inherit}
footer{margin-top:24px;text-align:center;font-size:15px}
footer a{color:var(--accent);text-decoration:none;margin:0 6px}
footer .games{display:flex;flex-wrap:wrap;justify-content:center;gap:2px 0;margin:0}
footer .games .muted{flex-basis:100%}
.test{font-size:13px;color:var(--bad);text-align:center;margin-bottom:8px}
.archline{font-size:15px;color:var(--muted);margin:-4px 0 12px}
.archline a,.card a.inl{color:var(--accent);font-weight:600}
.archlist{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:8px}
.archlist a{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;min-height:52px;border:1.5px solid var(--line);border-radius:12px;color:inherit;text-decoration:none;font-weight:600}
.archlist a:hover{border-color:var(--ink)}
.archlist .when{font-weight:400;color:var(--muted);font-size:15px}
.archlist .st{font-size:15px;white-space:nowrap;color:var(--muted)}
.archlist .st.done{color:var(--good)}
a.primary{text-align:center;text-decoration:none}

/* Cross-game cards (same design as Samey's result cards) */
.card + .xg{margin-top:14px}
.xg{display:flex;flex-direction:column;gap:10px;text-align:left;--xg-s:var(--surface,var(--card,#fff))}
.xg .xg-head{text-align:left;margin:4px 0 0;font-size:.92rem;font-weight:700;color:var(--muted)}
.xg-card{--c:#1f7a6d;display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:10px;background:color-mix(in srgb,var(--c) 12%,var(--xg-s));border:2px solid var(--c);color:var(--ink);text-decoration:none;min-height:44px}
.xg-card:hover .xg-arrow{transform:translateX(3px)}
.xg-card:focus-visible{outline:3px solid var(--c);outline-offset:2px}
.xg-icon{flex:none;width:48px;height:48px}
.xg-text{display:flex;flex-direction:column;gap:1px;min-width:0}
.xg-new{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:color-mix(in srgb,var(--c) 60%,var(--ink))}
.xg-title{font-family:var(--display,inherit);font-weight:800;font-size:1.3rem;line-height:1.1}
.xg-sub{font-size:.9rem;color:var(--muted)}
.xg-arrow{margin-left:auto;font-size:1.4rem;font-weight:700;flex:none;color:color-mix(in srgb,var(--c) 60%,var(--ink));transition:transform .15s}
.xg-samey{--c:#1f7a6d}.xg-spinonym{--c:#d99a1e}.xg-dotty{--c:#E2405A}.xg-syntaxed{--c:#3B5BDB}.xg-passe{--c:#7B3F73}.xg-natter{--c:#B0186A}.xg-roots{--c:#8A5A2B}.xg-phoney{--c:#6741d9}.xg-rhymey{--c:#0b7285}.xg-babel{--c:#c2410c}.xg-rizz{--c:#2b8a3e}
@media (prefers-reduced-motion:no-preference){.reveal{animation:up .2s ease-out}@keyframes up{from{transform:translateY(6px);opacity:.4}to{transform:none;opacity:1}}}
</style>
</head>
<body>
<main>
  <header><h1><svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="16" cy="32" r="8" fill="currentColor"/><path d="M30 18a20 20 0 0 1 0 28" stroke="var(--pop)" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M42 8a33 33 0 0 1 0 48" stroke="var(--pop)" stroke-width="6" fill="none" stroke-linecap="round"/></svg>Phoney</h1><div class="dots" id="dots"></div></header>
  <nav class="sy-bar" aria-label="Games"></nav>
  <div id="test"></div>
  <p class="archline" id="archLine" hidden></p>
  <div id="app"></div>
  <footer><p class="games"><span class="muted">More games:</span><a href="/">Samey</a><a href="/spinonym/">Spinonym</a><a href="/dotty/">Dotty</a><a href="/syntaxed/">Syntaxed</a><a href="/passe/">Passé</a><a href="/natter/">Natter</a><a href="/roots/">Roots</a><a href="/rizz/">Rizz</a><a href="/babel/">Babel</a><a href="/rhymey/">Rhymey</a></p>
  <p class="muted" style="margin-top:10px"><span id="archFoot" hidden><a href="#" id="archLink">Earlier puzzles</a> · </span><a href="/feedback/?game=phoney">Send feedback</a> · <a href="/support/?game=phoney">Support us</a></p></footer>
</main>
<script src="data.js"></script>
<script>
// ---- Schedule ----
// Phoney No. 1 is START. Monday to Saturday: four of the five everyday rounds (they take turns, so a different one
// sits out each day). Sunday: four of them, then Sound it out (read the phonetic script) as the special.
// Each round type works through its own list in data.js and starts again from the top when it runs out.
// Launched 29 Oct 2026. START is No. 1: Phoney
const START=Date.UTC(2026,9,29);
const dayDate=n=>new Date(START+n*864e5);   // read with UTC getters
const keyOf=n=>{const d=dayDate(n);return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0')};
const fmt=(n,o)=>dayDate(n).toLocaleDateString('en-GB',Object.assign({timeZone:'UTC'},o));
const T={
  silent:{name:'Silent partner',blurb:'Tap the letter nobody says',list:SILENT},
  odd:{name:'Odd sound out',blurb:'Same letters, but one sounds different',list:ODD},
  stress:{name:'Stress test',blurb:'REcord or reCORD? Pick the right beat',list:STRESS},
  place:{name:'Say the place',blurb:'How do the locals say it?',list:PLACE},
  stop:{name:'Spot the stop',blurb:"Which t's turn into a glottal stop?",list:STOP},
  ipa:{name:'Sound it out',blurb:'Sunday special: read the phonetic spelling',list:IPA}
};
const PLAY_ORDER=['silent','odd','stress','place','stop','ipa'];   // easier rounds first
const CYCLE=['silent','place','stress','odd','stop'];
const isSunday=n=>dayDate(n).getUTCDay()===0;
const roundsOn=n=>isSunday(n)?5:4;
function plan(n){
  let p=0;const seen={};let today=null;
  for(let d=0;d<=n;d++){
    const keys=[];
    for(let i=0;i<4;i++)keys.push(CYCLE[(p+i)%CYCLE.length]);
    p+=4;if(isSunday(d))keys.push('ipa');
    if(d===n)today=keys.map(k=>({k,c:seen[k]||0}));
    keys.forEach(k=>seen[k]=(seen[k]||0)+1);
  }
  return today.sort((x,y)=>PLAY_ORDER.indexOf(x.k)-PLAY_ORDER.indexOf(y.k)).map(({k,c})=>{const L=T[k].list;return{key:k,...T[k],it:L[c%L.length]}});
}

// ---- Which day is on screen ----
// samey.uk/phoney/#test plays today without saving; add ?day=N for Phoney No. N (any day, past or future).
// ?day=N on its own opens an earlier puzzle from the archive.
const ARCHIVE_ON=true;
addEventListener('hashchange',()=>location.reload());
const params=new URLSearchParams(location.search);
const now=new Date();
const TODAY=Math.max(0,Math.round((Date.UTC(now.getFullYear(),now.getMonth(),now.getDate())-START)/864e5));
const isTest=location.hash==='#test';
const ARCH=ARCHIVE_ON||isTest||location.hash==='#archive';
const ARCH_TAIL=ARCHIVE_ON?(isTest?'#test':''):(isTest?'#test':'#archive');
const td=parseInt(params.get('day'),10);
const N=Number.isInteger(td)&&td>=1&&(isTest||(ARCH&&td<=TODAY))?td-1:TODAY;
const isArch=!isTest&&N<TODAY;
const dateKey=keyOf(N);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ROUNDS=plan(N);
const items=ROUNDS.map(r=>r.it);
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

// Seeded shuffle so everyone sees the same option order on the same day
function rng(seed){let h=1779033703^seed.length;for(let i=0;i<seed.length;i++){h=Math.imul(h^seed.charCodeAt(i),3432918353);h=h<<13|h>>>19}return function(){h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);h^=h>>>16;return(h>>>0)/4294967296}}
function order(n,seed){const r=rng(seed),a=[...Array(n).keys()];for(let i=n-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

const $=s=>document.querySelector(s);
const app=$('#app');
let st={i:0,res:[]};

function dots(){$('#dots').innerHTML=items.map((_,k)=>`<div class="dot ${st.res[k]===true?'ok':st.res[k]===false?'no':k===st.i?'cur':''}"></div>`).join('')}

function intro(){
  app.innerHTML=`<div class="card"><div class="tag">${isArch||isTest?fmt(N,{weekday:'long',day:'numeric',month:'long'}):'Today'}</div>
  <div class="q">Quick rounds on how words really sound. Say them out loud: spelling is a terrible guide.</div>
  <p class="muted" style="margin:6px 0 0">One go at each. The rounds change every day${isSunday(N)?', and Sundays end with a special':''}. Here's today's mix:</p>
  <ul class="rounds">${ROUNDS.map(r=>`<li><b>${r.name}</b> · ${r.blurb}</li>`).join('')}</ul>
  <button class="primary" id="go">Play</button></div>`;
  $('#go').onclick=()=>{st={i:0,res:[]};round()};
  dots();
}

// Helpers
const unbr=s=>s.replace(/[\[\]]/g,'');
const uline=s=>esc(s).replace(/\[(.+?)\]/,'<u>$1</u>');
const bword=s=>esc(s).replace(/\[(.+?)\]/,'<b>$1</b>');
const word=s=>(s.match(/\[(.+?)\]/)||[])[1]||'';
const glot=p=>p.replace(/#+/g,'ʔ');   // Ge# a bi# -> Geʔ a biʔ
const STOP_RULE='In London speech, a t at the end of a word, or between vowels before an unstressed syllable, becomes a catch in the throat. A t that starts a word or a stressed syllable stays.';

function round(){
  const R=ROUNDS[st.i],k=R.key,it=R.it;dots();
  if(k==='silent')return silentRound(R,it);
  if(k==='stop')return stopRound(R,it);
  // Option 0 is always the right answer; the order on screen is shuffled (fixed order for Stress test).
  let opts,head,q,cls='two',fixed=false;
  if(k==='odd'){opts=it.w.map(uline);head=`<div class="big-q">Which <u style="text-decoration-color:var(--pop);text-decoration-thickness:3px;text-underline-offset:5px">${esc(it.t)}</u> sounds different?</div>`;q='Say them out loud and listen to the underlined letters.'}
  else if(k==='place'){opts=[it.a,...it.f].map(esc);head=`<div class="place">${esc(it.p)}</div><div class="sub">${esc(it.c)}</div>`;q='How do the locals say it? (Capitals mark the stress.)';cls='resp'}
  else if(k==='stress'){opts=[it.a,it.f].map(esc);const ai=/^[A-Z]/.test(it.a)?0:1;fixed=ai===0?[0,1]:[1,0];head=`<div class="sent">${bword(it.s)}</div>`;q=`Where does the stress fall in <b>${esc(word(it.s))}</b> here?`}
  else if(k==='ipa'){opts=[it.a,...it.f].map(esc);head=`<div class="big-q">Which word is this?</div><div class="ipa"><span class="sl">/</span>${esc(it.i)}<span class="sl">/</span></div>`;q='Read the phonetic spelling. ˈ comes before the stressed syllable; ː makes a sound long.'}
  const ord=fixed||order(opts.length,dateKey+'|'+k+'|'+(it.a||unbr(it.w[0])));
  app.innerHTML=`<div class="card"><div class="entry"><div class="tag">Round ${st.i+1} · ${R.name}</div>${head}</div><div class="q" style="${k==='ipa'?'font-size:16px;font-weight:500;color:var(--muted)':''}">${q}</div>
  <div class="opts ${cls}">${ord.map(x=>`<button class="opt" data-k="${x}">${opts[x]}</button>`).join('')}</div><div id="after" aria-live="polite"></div></div>`;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const ok=+b.dataset.k===0;
    app.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(+x.dataset.k===0)x.classList.add('right');else if(x!==b)x.classList.add('dim')});
    if(!ok)b.classList.add('wrong');
    after(ok,it.o);
  });
}

function silentRound(R,it){
  const L=[...it.w];
  app.innerHTML=`<div class="card"><div class="entry"><div class="tag">Round ${st.i+1} · ${R.name}</div>
  <div class="big-q">Which letter is silent?</div><div class="muted" style="font-size:15px">Say it out loud, then tap the letter you never hear.</div>
  <div class="lets">${L.map((c,i)=>`<button class="let" data-i="${i}" aria-label="${esc(c)}, letter ${i+1}">${esc(c)}</button>`).join('')}</div></div>
  <div id="after" aria-live="polite"></div></div>`;
  app.querySelectorAll('.let').forEach(b=>b.onclick=()=>{
    const j=+b.dataset.i,ok=j===it.s;
    app.querySelectorAll('.let').forEach(x=>{x.disabled=true;if(+x.dataset.i===it.s)x.classList.add('right')});
    if(!ok)b.classList.add('wrong');
    after(ok,`The silent letter is <b style="display:inline">${esc(L[it.s])}</b>. ${it.o}`);
  });
}

function stopRound(R,it){
  // Split the phrase into words, and each word into plain text and tappable t's.
  let n=0;const want=[];
  const html=it.p.split(' ').map(w=>{
    let out='',i=0;
    while(i<w.length){
      const c=w[i];
      if(c==='#'||((c==='t'||c==='T')&&!/[hH]/.test(w[i+1]||''))){
        let j=i;while(j<w.length&&w[j]===c)j++;
        const isStop=c==='#',txt=isStop?'t'.repeat(j-i):w.slice(i,j);
        want.push(isStop);out+=`<button class="tb" data-i="${n++}" aria-pressed="false">${esc(txt)}</button>`;i=j;
      }else{out+=esc(c);i++}
    }
    return `<span class="wd">${out}</span>`;
  }).join('');
  const need=want.filter(Boolean).length;
  app.innerHTML=`<div class="card"><div class="entry"><div class="tag">Round ${st.i+1} · ${R.name}</div>
  <div class="big-q">Drop your t's</div><div class="muted" style="font-size:15px">In a London accent, which t's turn into a glottal stop (a catch in the throat)? There are <b>${need}</b>.</div>
  <div class="phrase">${html}</div></div>
  <div class="count" id="cnt">0 of ${need} tapped</div><button class="primary" id="check" disabled>Check</button><div id="after" aria-live="polite"></div></div>`;
  const on=new Set();
  app.querySelectorAll('.tb').forEach(b=>b.onclick=()=>{
    const j=+b.dataset.i;if(on.has(j))on.delete(j);else on.add(j);
    b.classList.toggle('on',on.has(j));b.setAttribute('aria-pressed',on.has(j));
    $('#cnt').textContent=`${on.size} of ${need} tapped`;$('#check').disabled=on.size!==need;
  });
  $('#check').onclick=()=>{
    let ok=true;
    app.querySelectorAll('.tb').forEach(b=>{const j=+b.dataset.i,w=want[j],got=on.has(j);b.disabled=true;b.classList.remove('on');
      if(w&&got)b.classList.add('hit');else if(got){b.classList.add('extra');ok=false}else if(w){b.classList.add('miss');ok=false}else b.classList.add('keep')});
    $('#check').remove();$('#cnt').remove();
    after(ok,`<div class="pat">${esc(glot(it.p))}</div>${it.o}${ok?'':' Dashed boxes are the stops you missed.'}<div class="muted" style="font-size:15px;margin-top:8px">${STOP_RULE}</div>`);
  };
}

function after(ok,html){
  st.res[st.i]=ok;dots();
  const last=st.i===items.length-1,k=ROUNDS[st.i].key;
  const head=ok?'Correct.':k==='stop'?'Not quite. The stops are marked.':k==='silent'?'Not quite. The silent letter is struck through.':'Not quite. The right one is highlighted.';
  $('#after').innerHTML=`<div class="reveal"><b>${head}</b>${html}</div><button class="primary" id="next">${last?'See results':'Next round'}</button>`;
  const nx=$('#next');
  nx.onclick=()=>{if(last){if(!isTest)store.set('phoney-'+dateKey,st.res);results()}else{st.i++;round();window.scrollTo(0,0)}};
  nx.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function rank(s,n){return['Mumbler','Mispronouncer','Elocution Pupil','Sound Detective','Phonetics Buff','Received Pronouncer'][Math.round(s/n*5)]}
function recapLine(k,it){
  if(k==='silent')return[it.w,'silent '+it.w[it.s]];
  if(k==='place')return[it.p,'said '+it.a];
  if(k==='stress')return[word(it.s),it.a+' in this sentence'];
  if(k==='odd')return[unbr(it.w[0]),'the odd '+it.t+' out'];
  if(k==='stop')return[glot(it.p),'London glottal stops'];
  return['/'+it.i+'/',it.a];
}

function results(){
  st.i=items.length;dots();
  const s=st.res.filter(Boolean).length,n=items.length;
  const ticks=st.res.map(x=>x?'✅':'❌').join('');
  if(!isTest&&!isArch)(window.SameySetQ=window.SameySetQ||[]).push(['phoney',s+'/'+n]);
  const nice=fmt(N,{weekday:'short',day:'numeric',month:'short'});
  const share=`Phoney No. ${N+1}${isArch?' (archive)':''}\n${s}/${n} ${ticks}\n${rank(s,n)}\nYour go: https://samey.uk/phoney/ #sameyuk`;
  app.innerHTML=`<div class="card center"><div class="tag">${isTest?'Test · No. '+(N+1)+' · '+nice:isArch?'No. '+(N+1)+' · '+nice:nice}</div>
  <div class="score">${s}/${n}</div><div class="ticks">${ticks}</div><div class="rank">${rank(s,n)}</div>
  <p class="muted">${isArch?`<a class="inl" href="#" id="moreArch">Play another earlier puzzle</a> or <a class="inl" href="./${ARCH_TAIL}">go back to today's puzzle</a>.`:'<span data-next="A new mix of rounds in {t}.">A new mix of rounds tomorrow.</span>'+(ARCH&&TODAY>=1&&!isTest?` Can't wait? <a class="inl" href="#" id="moreArch">Play earlier puzzles</a>.`:'')}</p>
  <button class="primary" id="share">Share</button><button class="ghost" id="copy">Copy result</button>
  <ul class="recap">${items.map((it,k)=>{const [h,m]=recapLine(ROUNDS[k].key,it);return`<li><span>${st.res[k]?'✅':'❌'}</span><span class="h"${ROUNDS[k].key==='stop'||ROUNDS[k].key==='ipa'?' style="font-family:var(--ipa)"':''}>${esc(h)}</span><span class="m">${esc(m)}</span><span class="flag"><a href="/feedback/?game=phoney&type=puzzle&puzzle=${encodeURIComponent((isArch?'No. '+(N+1):nice)+' · '+ROUNDS[k].name+' · '+h)}">Wrong?</a></span></li>`}).join('')}</ul></div>${document.getElementById('xgCards').innerHTML}`;
  $('#share').onclick=()=>{if(navigator.share){navigator.share({text:share}).catch(()=>{})}else{location.href='https://wa.me/?text='+encodeURIComponent(share)}};
  $('#copy').onclick=()=>{try{navigator.clipboard.writeText(share).then(()=>{$('#copy').textContent='Copied'},()=>{})}catch(e){}};
  const more=$('#moreArch');if(more)more.onclick=e=>{e.preventDefault();openArchive()};
}

function openArchive(){
  const list=[];
  for(let k=TODAY-1;k>=0;k--){
    const r=store.get('phoney-'+keyOf(k)),n=roundsOn(k);
    const stx=r&&r.length===n?`<span class="st done">${r.filter(Boolean).length}/${n}</span>`:'<span class="st">Play →</span>';
    list.push(`<li><a href="?day=${k+1}${ARCH_TAIL}"><span>No. ${k+1} <span class="when">· ${fmt(k,{weekday:'short',day:'numeric',month:'short'})}</span></span>${stx}</a></li>`);
  }
  if(!list.length)list.push('<li class="muted">No earlier puzzles yet. Come back tomorrow.</li>');
  $('#archLine').hidden=true;$('#dots').innerHTML='';
  app.innerHTML=`<div class="card"><div class="q" style="font-size:22px;margin-top:0">Earlier puzzles</div>
  <p class="muted" style="margin:4px 0 0">Missed a day? Every past Phoney is here.</p>
  <ul class="archlist">${list.join('')}</ul><a class="primary" href="./${ARCH_TAIL}">Back to today's puzzle</a></div>`;
  window.scrollTo(0,0);
}

if(isTest)$('#test').innerHTML=`<div class="test">Test mode: No. ${N+1} · ${fmt(N,{weekday:'short',day:'numeric',month:'short'})} · results not saved</div>`;
if(ARCH&&TODAY>=1){$('#archFoot').hidden=false;$('#archLink').onclick=e=>{e.preventDefault();openArchive()};}
if(isArch){const l=$('#archLine');l.hidden=false;l.innerHTML=`Earlier puzzle · No. ${N+1} · <a href="./${ARCH_TAIL}">Today's puzzle</a>`;}
const done=!isTest&&store.get('phoney-'+dateKey);
// Wait for the page to finish loading: the results screen uses the 'Fancy another?' cards further down.
document.addEventListener('DOMContentLoaded',()=>{if(done&&done.length===items.length){st.res=done;results()}else intro();});
</script>
