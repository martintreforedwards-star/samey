<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mispelt</title>
<meta name="description" content="A daily spelling game. Five quick rounds: pick the right spelling, spot the mistake, British or American, and fix it.">
<meta name="robots" content="noindex">
<link rel="icon" href="/mispelt/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap">
<style>
:root{--bg:#f7f8fb;--card:#fff;--ink:#141a26;--muted:#5b6475;--line:#dfe3eb;--accent:#b3261e;--on-accent:#fff;--navy:#1d2a44;--good:#2b8a3e;--bad:#c92a2a;--goodbg:#ebfbee;--badbg:#fff5f5;--chip:#eef1f6;--head:"Fraunces",Georgia,serif}
@media (prefers-color-scheme:dark){:root{--bg:#10131a;--card:#181c25;--ink:#eef1f6;--muted:#9aa3b5;--line:#2c3342;--accent:#ff8a80;--on-accent:#181c25;--navy:#c9d4ea;--good:#8ce99a;--bad:#ff8787;--goodbg:#173022;--badbg:#3a1f22;--chip:#232938}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:480px;margin:0 auto;padding:16px 16px 40px;min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
h1{font-family:var(--head);font-weight:800;font-size:34px;margin:0;line-height:1;letter-spacing:-.5px}
h1 .squig{text-decoration:underline wavy var(--accent);text-decoration-thickness:2px;text-underline-offset:6px}
h1 svg{width:30px;height:30px;vertical-align:-4px;margin-right:6px}
.pips{display:flex;gap:5px}
.pip{width:12px;height:12px;border-radius:50%;background:var(--line)}
.pip.g{background:var(--good)}.pip.x{background:var(--bad)}.pip.now{background:var(--navy)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.tag{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:600}
.kind{font-family:var(--head);font-weight:800;font-size:22px;margin:4px 0 2px}
.sub{color:var(--muted);font-size:15px;margin:0 0 14px}
.opts{display:grid;gap:8px}
.opt{display:block;width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);font:600 20px/1.3 var(--head);color:var(--ink);cursor:pointer;min-height:54px;letter-spacing:.3px}
.opt:hover:not([disabled]){border-color:var(--navy)}
.opt:focus-visible,.w:focus-visible,.primary:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--good);background:var(--goodbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg);text-decoration:line-through}
.opt.dim{opacity:.5}
.sent{font:400 22px/1.9 var(--head);margin:6px 0 4px}
.w{font:inherit;color:inherit;background:none;border:0;border-bottom:2px dotted var(--line);padding:0 2px;margin:0 1px;border-radius:4px;cursor:pointer}
.w:hover:not([disabled]){background:var(--chip)}
.w[disabled]{cursor:default;border-bottom-color:transparent}
.w.right{background:var(--goodbg);color:var(--good);text-decoration:underline wavy var(--good);text-underline-offset:5px}
.w.wrong{background:var(--badbg);color:var(--bad)}
.shown{font:600 30px/1.2 var(--head);text-align:center;margin:8px 0 14px;text-decoration:underline wavy var(--accent);text-decoration-thickness:2px;text-underline-offset:7px}
.typed{display:flex;gap:8px}
.typed input{flex:1;min-width:0;font:600 20px/1.2 var(--head);padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
.typed input:focus{outline:3px solid var(--navy);outline-offset:1px;border-color:transparent}
.typed .primary{flex:0 0 auto;padding:0 20px}
.reveal{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--chip);font-size:15px}
.reveal .big{font:800 22px/1.3 var(--head);margin-top:2px}
.btns{display:flex;gap:10px;margin-top:14px}
button{font:inherit;color:inherit;cursor:pointer}
.primary{flex:1;padding:14px;border:0;border-radius:12px;background:var(--navy);color:var(--bg);font-weight:700;min-height:50px}
.primary[disabled]{opacity:.4;cursor:default}
.center{text-align:center}
.rank{font-family:var(--head);font-weight:800;font-size:30px;margin:6px 0}
.squares{font-size:24px;letter-spacing:3px;margin:6px 0 4px}
.muted{color:var(--muted);font-size:15px}
a{color:var(--accent)}
.test{background:var(--chip);border-radius:10px;padding:8px 12px;font-size:14px;margin-bottom:12px}
.ex{margin:10px 0 12px;font-size:15px}.ex summary{cursor:pointer;color:var(--accent);font-weight:600}
.how{margin:8px 0 0;padding-left:20px;color:var(--muted)}
.how li{margin:3px 0}
.recap{list-style:none;padding:0;margin:8px 0 0}
.recap li{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.recap .k{color:var(--muted)}
.recap .v{font:600 18px/1.3 var(--head);text-align:right}
.recap .v s{color:var(--muted);font-weight:400;margin-right:6px}
footer{margin-top:18px;text-align:center}
</style>
</head>
<body>
<main>
  <header><h1><svg viewBox="0 0 64 64" aria-hidden="true"><rect x="4" y="4" width="56" height="56" rx="12" fill="#1d2a44"/><path d="M17 22h30M17 32h22" stroke="#fff" stroke-width="5" stroke-linecap="round"/><path d="M15 45q3.5-5 7 0t7 0 7 0 7 0 7 0" fill="none" stroke="#ef5350" stroke-width="3.5" stroke-linecap="round"/></svg><span class="squig">Mispelt</span></h1><div class="pips" id="pips" aria-hidden="true"></div></header>
  <nav class="sy-bar" aria-label="Games"></nav>
  <div id="test"></div>
  <div id="app"></div>
  <footer><p class="muted"><a href="/feedback/?game=mispelt">Send feedback</a> · <a href="/support/?game=mispelt">Support us</a></p></footer>
</main>
<script src="data.js"></script>
<script>
// ---- Which day is on screen ----
// Preview: day N comes from DAYS in order. ?day=N plays Mispelt No. N; #test plays without saving.
const START=Date.UTC(2026,10,1);
const dayDate=n=>new Date(START+n*864e5);
const fmt=(n,o)=>dayDate(n).toLocaleDateString('en-GB',Object.assign({timeZone:'UTC'},o));
const keyOf=n=>{const d=dayDate(n);return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0')};
addEventListener('hashchange',()=>location.reload());
const params=new URLSearchParams(location.search);
const now=new Date();
const TODAY=Math.max(0,Math.round((Date.UTC(now.getFullYear(),now.getMonth(),now.getDate())-START)/864e5));
const isTest=location.hash==='#test';
const td=parseInt(params.get('day'),10);
const N=Number.isInteger(td)&&td>=1?td-1:TODAY;
const D=DAYS[N%DAYS.length];
const SKEY='mispelt-'+keyOf(N);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){if(isTest)return;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function shuffled(arr,seed){const a=[...arr];let s=seed*9301+49297;for(let i=a.length-1;i>0;i--){s=(s*9301+49297)%233280;const j=Math.floor(s/233280*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

// The five rounds, in a fixed order
const ROUNDS=[
  {type:'choice',name:'Which is right?',sub:'Pick the correct spelling.',opts:shuffled([D.pick.c,...D.pick.x],N*11+1),right:D.pick.c},
  {type:'spot',name:'Spot the mistake',sub:'One word in this sentence is spelt wrong. Tap it.',d:D.spot},
  {type:'choice',name:'British or American?',sub:`Which is the British spelling${D.uk.ctx?` (${esc(D.uk.ctx)})`:''}?`,opts:shuffled([D.uk.b,D.uk.a],N*11+3),right:D.uk.b,other:D.uk.a},
  {type:'fix',name:'Fix it',sub:'This word is spelt wrong. Type it correctly.',d:D.fix},
  {type:'choice',name:'Which is right? (tricky)',sub:'Pick the correct spelling.',opts:shuffled([D.hard.c,...D.hard.x],N*11+5),right:D.hard.c}
];
const MAX=ROUNDS.length;

let st=store.get(SKEY)||{r:0,ans:[],ok:[],done:false};
const $=s=>document.querySelector(s);
const app=$('#app');
function save(){store.set(SKEY,st)}
const score=()=>st.ok.filter(Boolean).length;
const norm=s=>String(s).trim().toLowerCase().replace(/[’']/g,"'");
const clean=w=>w.replace(/^[^\p{L}]+|[^\p{L}]+$/gu,'');
function rank(t){return['Back to the dictionary','Back to the dictionary','Getting there','Spellbound','Top of the class','Word perfect'][t]}
function pips(cur){$('#pips').innerHTML=ROUNDS.map((_,i)=>`<span class="pip ${st.ok[i]===true?'g':st.ok[i]===false?'x':i===cur?'now':''}"></span>`).join('')}
const answerOf=R=>R.type==='choice'?R.right:R.d.c;

function play(){
  const i=st.r,R=ROUNDS[i],answered=st.ok[i]!=null;
  pips(i);
  let body='';
  if(R.type==='choice'){
    const cls=o=>!answered?'':o===R.right?' right':o===st.ans[i]?' wrong':' dim';
    body=`<div class="opts" role="group" aria-label="Spellings">${R.opts.map((o,j)=>`<button class="opt${cls(o)}" data-o="${esc(o)}"${answered?' disabled':''}>${esc(o)}</button>`).join('')}</div>`;
  }else if(R.type==='spot'){
    const words=R.d.s.split(' ');
    body=`<p class="sent">${words.map((w,j)=>{const isBad=clean(w)===R.d.w,picked=st.ans[i]===j;const c=!answered?'':isBad?' right':picked?' wrong':'';return`<button class="w${c}" data-j="${j}"${answered?' disabled':''}>${esc(w)}</button>`}).join(' ')}</p>`;
  }else{
    body=`<div class="shown" aria-label="Misspelled word">${esc(R.d.w)}</div>
    <form class="typed" id="fixf" autocomplete="off"><input id="fixi" type="text" inputmode="text" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Your spelling" value="${answered?esc(st.ans[i]):''}"${answered?' disabled':''}><button class="primary" id="fixb"${answered?' disabled':''}>Check</button></form>`;
  }
  let reveal='';
  if(answered){
    const ok=st.ok[i];
    let line;
    if(R.type==='spot')line=`It's spelt <b>${esc(R.d.c)}</b>, not <s>${esc(R.d.w)}</s>.`;
    else if(R.type==='fix')line=ok?`<b>${esc(R.d.c)}</b>`:`You typed <s>${esc(st.ans[i]||'(nothing)')}</s>. It's spelt:<div class="big">${esc(R.d.c)}</div>`;
    else if(R.other)line=`British: <b>${esc(R.right)}</b> · American: <b>${esc(R.other)}</b>`;
    else line=`It's spelt <b>${esc(R.right)}</b>.`;
    reveal=`<div class="reveal" role="status"><b>${ok?'Correct!':'Not quite.'}</b> ${line}</div>
    <div class="btns"><button class="primary" id="next">${i+1<MAX?'Next round':'See how you did'}</button></div>`;
  }
  app.innerHTML=`<div class="card">
    <div class="tag">${isTest?'Test · ':''}No. ${N+1} · ${fmt(N,{weekday:'short',day:'numeric',month:'short'})} · Round ${i+1} of ${MAX}</div>
    <div class="kind">${R.name}</div>
    <p class="sub">${R.sub}</p>
    ${i===0&&!answered?`<details class="ex"><summary>How to play</summary><ol class="how">
      <li>Five quick rounds, one point each.</li>
      <li>Pick the right spelling, spot the mistake in a sentence, choose the British spelling, then type a word correctly.</li>
      <li>The last round is the tricky one.</li>
      <li>British spellings throughout. One go per round.</li></ol></details>`:''}
    ${body}
    ${reveal}
  </div>`;
  if(!answered){
    if(R.type==='choice')app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{st.ans[i]=b.dataset.o;st.ok[i]=b.dataset.o===R.right;save();play()});
    if(R.type==='spot')app.querySelectorAll('.w').forEach(b=>b.onclick=()=>{const j=+b.dataset.j;st.ans[i]=j;st.ok[i]=clean(R.d.s.split(' ')[j])===R.d.w;save();play()});
    if(R.type==='fix'){const f=$('#fixf'),inp=$('#fixi'),btn=$('#fixb');const upd=()=>btn.disabled=!inp.value.trim();upd();inp.oninput=upd;
      f.onsubmit=e=>{e.preventDefault();const v=inp.value.trim();if(!v)return;st.ans[i]=v;st.ok[i]=norm(v)===norm(R.d.c);save();play()}}
  }
  const nb=$('#next');if(nb){nb.onclick=()=>{if(st.r+1<MAX){st.r++;save();play()}else{st.done=true;save();end()}};nb.focus({preventScroll:true})}
}

function end(){
  pips(-1);
  const t=score();
  const sq=ROUNDS.map((_,i)=>st.ok[i]?'🟩':'🟥').join('');
  const share=`Mispelt No. ${N+1}\n${sq} ${t}/${MAX}\n${rank(t)}\nYour go: https://samey.uk/mispelt/ #sameyuk`;
  const wrongOf=(R,i)=>R.type==='choice'?(st.ok[i]?'':st.ans[i]):R.type==='spot'?R.d.w:R.d.w;
  app.innerHTML=`<div class="card center">
    <div class="tag">${isTest?'Test · ':''}No. ${N+1} · ${fmt(N,{weekday:'short',day:'numeric',month:'short'})}</div>
    <div class="rank">${rank(t)}</div>
    <div class="squares" aria-label="${t} out of ${MAX}">${sq}</div>
    <p class="muted">${t} of ${MAX} correct</p>
    <div class="btns"><button class="primary" id="share">Share</button></div>
    <p class="muted"><span data-next="Next Mispelt in {t}.">New spellings tomorrow.</span></p>
  </div>
  <div class="card" style="margin-top:14px"><div class="tag">Today's spellings</div>
    <ul class="recap">${ROUNDS.map((R,i)=>{const w=wrongOf(R,i);return`<li><span class="k">${st.ok[i]?'✓':'✗'} ${esc(R.name.replace(' (tricky)',''))}</span><span class="v">${w?`<s>${esc(w)}</s>`:''}${esc(answerOf(R))}</span></li>`}).join('')}</ul>
    <p class="muted" style="margin-top:12px">Think one's wrong? <a href="/feedback/?game=mispelt&type=puzzle&puzzle=${encodeURIComponent('No. '+(N+1))}">Tell us</a>.</p>
  </div>`;
  $('#share').onclick=()=>{if(navigator.share){navigator.share({text:share}).catch(()=>{});return}try{navigator.clipboard.writeText(share).then(()=>{$('#share').textContent='Copied'})}catch(e){}};
}

if(isTest)$('#test').innerHTML=`<div class="test">Test mode: No. ${N+1} · results not saved · <a href="?day=${(N+1)%DAYS.length+1}#test">Next day</a></div>`;
st.done?end():play();
</script>
<script src="/daily.js"></script>
<!-- Cloudflare Web Analytics --><script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "210d8562172a4416bc59877612814183"}'></script><!-- End Cloudflare Web Analytics -->
</body>
</html>
