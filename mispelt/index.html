<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mispelt</title>
<meta name="description" content="A daily game about why English spelling is so odd. Five quick rounds, and a story behind every word.">
<meta name="robots" content="noindex">
<link rel="icon" href="/mispelt/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap">
<style>
:root{--bg:#f7f8fb;--card:#fff;--ink:#141a26;--muted:#5b6475;--line:#dfe3eb;--accent:#b3261e;--on-accent:#fff;--navy:#1d2a44;--good:#2b8a3e;--bad:#c92a2a;--goodbg:#ebfbee;--badbg:#fff5f5;--chip:#eef1f6;--head:"Fraunces",Georgia,serif}
@media (prefers-color-scheme:dark){:root{--bg:#10131a;--card:#181c25;--ink:#eef1f6;--muted:#9aa3b5;--line:#2c3342;--accent:#ff8a80;--on-accent:#181c25;--navy:#c9d4ea;--good:#8ce99a;--bad:#ff8787;--goodbg:#173022;--badbg:#3a1f22;--chip:#232938}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:480px;margin:0 auto;padding:16px 16px 40px;min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
h1{font-family:var(--head);font-weight:800;font-size:34px;margin:0;line-height:1;letter-spacing:-.5px}
h1 .squig{text-decoration:underline wavy var(--accent);text-decoration-thickness:2px;text-underline-offset:6px}
h1 svg{width:30px;height:30px;vertical-align:-4px;margin-right:6px}
.pips{display:flex;gap:5px}
.pip{width:12px;height:12px;border-radius:50%;background:var(--line)}
.pip.g{background:var(--good)}.pip.x{background:var(--muted)}.pip.now{background:var(--navy)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.tag{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:600}
.kind{font-family:var(--head);font-weight:800;font-size:22px;margin:4px 0 2px}
.sub{color:var(--muted);font-size:15px;margin:0 0 14px}
.opts{display:grid;gap:12px}
.opt{display:block;width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);font:600 21px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);cursor:pointer;min-height:58px;letter-spacing:.6px;word-break:break-word}
.opt:hover:not([disabled]){border-color:var(--navy)}
.opt:focus-visible,.w:focus-visible,.primary:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--good);background:var(--goodbg)}
.opt.wrong{border-color:var(--muted);background:var(--chip)}
.opt.dim{opacity:.5}
.sent{font:400 22px/1.9 var(--head);margin:6px 0 4px}
.w{font:inherit;color:inherit;background:none;border:0;border-bottom:2px dotted var(--line);padding:0 2px;margin:0 1px;border-radius:4px;cursor:pointer}
.w:hover:not([disabled]){background:var(--chip)}
.w[disabled]{cursor:default;border-bottom-color:transparent}
.w.right{background:var(--goodbg);color:var(--good);text-decoration:underline wavy var(--good);text-underline-offset:5px}
.w.wrong{background:var(--badbg);color:var(--bad)}
.shown{font:600 30px/1.2 var(--head);text-align:center;margin:8px 0 14px;text-decoration:underline wavy var(--accent);text-decoration-thickness:2px;text-underline-offset:7px}
.typed{display:flex;gap:8px}
.typed input{flex:1;min-width:0;font:600 20px/1.2 var(--head);padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
.typed input:focus{outline:3px solid var(--navy);outline-offset:1px;border-color:transparent}
.typed .primary{flex:0 0 auto;padding:0 20px}
.reveal{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--chip);font-size:15px}
.reveal .big{font:800 22px/1.3 var(--head);margin-top:2px}
.btns{display:flex;gap:10px;margin-top:14px}
button{font:inherit;color:inherit;cursor:pointer}
.primary{flex:1;padding:14px;border:0;border-radius:12px;background:var(--navy);color:var(--bg);font-weight:700;min-height:50px}
.primary[disabled]{opacity:.4;cursor:default}
.center{text-align:center}
.rank{font-family:var(--head);font-weight:800;font-size:30px;margin:6px 0}
.squares{font-size:24px;letter-spacing:3px;margin:6px 0 4px}
.muted{color:var(--muted);font-size:15px}
a{color:var(--accent)}
.test{background:var(--chip);border-radius:10px;padding:8px 12px;font-size:14px;margin-bottom:12px}
.ex{margin:10px 0 12px;font-size:15px}.ex summary{cursor:pointer;color:var(--accent);font-weight:600}
.how{margin:8px 0 0;padding-left:20px;color:var(--muted)}
.how li{margin:3px 0}
.recap{list-style:none;padding:0;margin:8px 0 0}
.recap li{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.recap .k{color:var(--muted)}
.recap .v{font:600 18px/1.3 var(--head);text-align:right}
.recap .v s{color:var(--muted);font-weight:400;margin-right:6px}
footer{margin-top:18px;text-align:center}
.dots{letter-spacing:2px}
.sentq{font:500 20px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;margin:4px 0 14px}
.sentq .gap{display:inline-block;min-width:4.5em;border-bottom:2px solid var(--navy)}
.oldq{font-size:18px;line-height:1.55;margin:4px 0 14px}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:6px 0 4px}
.tile{width:46px;height:56px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:700 26px/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center}
.tile:hover:not([disabled]){border-color:var(--navy)}
.tile:focus-visible,.hear:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
.tile[disabled]{cursor:default}
.tile.right{border-color:var(--good);background:var(--goodbg);color:var(--good)}
.tile.wrong{border-color:var(--muted);background:var(--chip)}
.hear{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:15px;font-weight:600;margin-top:10px}
.story{margin-top:8px;line-height:1.5}
.story i{font-style:italic}
.flag{font-size:13px;margin-left:6px}
.recap li{flex-direction:column;gap:4px}
.recap .top{display:flex;justify-content:space-between;gap:10px}
.recap .n{color:var(--muted);font-size:14px;line-height:1.45}

</style>
<link rel="manifest" href="/manifest.webmanifest">
</head>
<body>
<main>
  <header><h1><svg viewBox="0 0 64 64" aria-hidden="true"><rect x="4" y="4" width="56" height="56" rx="12" fill="#1d2a44"/><path d="M17 22h30M17 32h22" stroke="#fff" stroke-width="5" stroke-linecap="round"/><path d="M15 45q3.5-5 7 0t7 0 7 0 7 0 7 0" fill="none" stroke="#ef5350" stroke-width="3.5" stroke-linecap="round"/></svg><span class="squig">Mispelt</span></h1><div class="pips" id="pips" aria-hidden="true"></div></header>
  <nav class="sy-bar" aria-label="Games"></nav>
  <div id="test"></div>
  <div id="app"></div>
  <footer><p class="muted"><a href="/feedback/?game=mispelt">Send feedback</a> · <a href="/support/?game=mispelt">Support the games</a></p></footer>
</main>
<script src="data.js"></script>
<script>
// ---- Which day is on screen ----
// Preview: today's puzzle depends on the weekday (see data.js). ?day=N plays Mispelt No. N; #test plays without saving.
// START (and so the No.) will be reset to the launch day.
const START=Date.UTC(2026,10,23);
const dayDate=n=>new Date(START+n*864e5);
const fmt=(n,o)=>dayDate(n).toLocaleDateString('en-GB',Object.assign({timeZone:'UTC'},o));
const keyOf=n=>{const d=dayDate(n);return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0')};
addEventListener('hashchange',()=>location.reload());
const params=new URLSearchParams(location.search);
const now=new Date();
const TODAY=Math.max(0,Math.round((Date.UTC(now.getFullYear(),now.getMonth(),now.getDate())-START)/864e5));
const isTest=location.hash==='#test';
const td=parseInt(params.get('day'),10);
const N=Number.isInteger(td)&&td>=1?td-1:TODAY;
const WD=(Math.round(dayDate(N)/864e5)+3)%7; // Monday = 0 (1 Jan 1970 was a Thursday)
const D=DAYS[WD%DAYS.length], DOT=DOTS[WD];
const dots='●'.repeat(DOT)+'○'.repeat(5-DOT);
const SKEY='mispelt2-'+keyOf(N);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){if(isTest)return;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function shuffled(arr,seed){const a=[...arr];let s=seed*9301+49297;for(let i=a.length-1;i>0;i--){s=(s*9301+49297)%233280;const j=Math.floor(s/233280*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

// The five rounds, in a fixed order. Fridays swap British or American for a long word.
const last=D.long
  ?{type:'choice',name:'Long word Friday',sub:'Which is the standard spelling? Take your time.',opts:shuffled([D.long.c,...D.long.x],N*11+5),right:D.long.c,n:D.long.n,say:D.long.c}
  :{type:'choice',name:'British or American?',sub:`Which is the British spelling${D.uk.ctx?` (${esc(D.uk.ctx)})`:''}?`,opts:shuffled([D.uk.b,D.uk.a],N*11+5),right:D.uk.b,other:D.uk.a,n:D.uk.n,say:D.uk.b};
const ROUNDS=[
  {type:'choice',name:'Standard spelling',sub:'Which is the standard spelling?',opts:shuffled([D.std.c,...D.std.x],N*11+1),right:D.std.c,n:D.std.n,say:D.std.c},
  {type:'blame',name:'Blame the scholars',sub:'One letter here was added on purpose, and nobody has ever said it. Tap it.',d:D.blame,right:D.blame.w,n:D.blame.n,say:D.blame.w},
  {type:'choice',name:'Became right',sub:'This word began as a mistake. What do we say now?',q:D.became.q,opts:shuffled([D.became.c,...D.became.x],N*11+3),right:D.became.c,n:D.became.n,say:D.became.c},
  {type:'choice',name:'Sound-alikes',sub:'They sound the same. Which one fits?',s:D.sound.s,opts:shuffled([D.sound.c,...D.sound.x],N*11+4),right:D.sound.c,n:D.sound.n,say:D.sound.c},
  last
];
const MAX=ROUNDS.length;

let st=store.get(SKEY)||{r:0,ans:[],ok:[],done:false};
const $=s=>document.querySelector(s);
const app=$('#app');
function save(){store.set(SKEY,st)}
const score=()=>st.ok.filter(Boolean).length;
function rank(t){return['Fresh eyes','Fresh eyes','Word collector','Spelling sleuth','Silent letter spotter','Word perfect'][t]}
function pips(cur){$('#pips').innerHTML=ROUNDS.map((_,i)=>`<span class="pip ${st.ok[i]===true?'g':st.ok[i]===false?'x':i===cur?'now':''}"></span>`).join('')}

// Optional: hear a word, using the browser's own voice (hidden where there isn't one)
const canSay='speechSynthesis' in window&&'SpeechSynthesisUtterance' in window;
function say(w){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(w);u.lang='en-GB';u.rate=.85;const v=speechSynthesis.getVoices().find(v=>/en[-_]GB/i.test(v.lang));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}
const hearBtn=w=>canSay?`<button class="hear" type="button" data-say="${esc(w)}">🔊 Hear it</button>`:'';
const flagLink=(i,R)=>`<a class="flag" href="/feedback/?game=mispelt&type=puzzle&puzzle=${encodeURIComponent('No. '+(N+1)+' · '+R.name+' · '+R.right)}">Wrong?</a>`;

function play(){
  const i=st.r,R=ROUNDS[i],answered=st.ok[i]!=null;
  pips(i);
  let body='';
  if(R.q)body+=`<p class="oldq">${R.q}</p>`;
  if(R.s)body+=`<p class="sentq">${esc(R.s).replace('___','<span class="gap" aria-label="gap"></span>')}</p>`;
  if(R.type==='choice'){
    const cls=o=>!answered?'':o===R.right?' right':o===st.ans[i]?' wrong':' dim';
    body+=`<div class="opts" role="group" aria-label="Answers">${R.opts.map(o=>`<button class="opt${cls(o)}" data-o="${esc(o)}"${answered?' disabled':''}>${esc(o)}</button>`).join('')}</div>`;
  }else{
    const cls=j=>!answered?'':j===R.d.i?' right':j===st.ans[i]?' wrong':'';
    body+=`<div class="tiles" role="group" aria-label="Letters">${[...R.d.w].map((ch,j)=>`<button class="tile${cls(j)}" data-j="${j}" aria-label="Letter ${j+1}: ${esc(ch)}"${answered?' disabled':''}>${esc(ch)}</button>`).join('')}</div>`;
    if(!answered)body+=`<div class="center">${hearBtn(R.say)}</div>`;
  }
  let reveal='';
  if(answered){
    const ok=st.ok[i];
    const head=ok?'Well spotted!':R.type==='blame'?`Not quite. It's the <b>${esc(R.d.w[R.d.i])}</b>. Here's the story.`:`Not quite. It's <b>${esc(R.right)}</b>. Here's the story.`;
    const extra=R.other?`<div class="muted" style="margin-top:6px">British: <b>${esc(R.right)}</b> · American: <b>${esc(R.other)}</b></div>`:'';
    reveal=`<div class="reveal" role="status"><b>${head}</b>${extra}<div class="story">${R.n}</div>${hearBtn(R.say)}${flagLink(i,R)}</div>
    <div class="btns"><button class="primary" id="next">${i+1<MAX?'Next round':'See how you did'}</button></div>`;
  }
  app.innerHTML=`<div class="card">
    <div class="tag">${isTest?'Test · ':''}No. ${N+1} · ${fmt(N,{weekday:'short',day:'numeric',month:'short'})} · <span class="dots" aria-label="Difficulty ${DOT} of 5">${dots}</span> · Round ${i+1} of ${MAX}</div>
    <div class="kind">${R.name}</div>
    <p class="sub">${R.sub}</p>
    ${i===0&&!answered?`<details class="ex"><summary>How to play</summary><ol class="how">
      <li>Five quick rounds, one point each, and a story behind every answer.</li>
      <li>Spot the standard spelling, find the letter scholars sneaked in, name the word that began as a mistake, pick the right sound-alike, then British or American.</li>
      <li>Fridays end with a long word instead.</li>
      <li>English spelling is odd, not you. It gets a little trickier through the week.</li>
      <li>No timer. Tap 🔊 to hear a word.</li></ol></details>`:''}
    ${body}
    ${reveal}
  </div>`;
  app.querySelectorAll('.hear').forEach(b=>b.onclick=()=>say(b.dataset.say));
  if(!answered){
    if(R.type==='choice')app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{st.ans[i]=b.dataset.o;st.ok[i]=b.dataset.o===R.right;save();play()});
    else app.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{const j=+b.dataset.j;st.ans[i]=j;st.ok[i]=j===R.d.i;save();play()});
  }
  const nb=$('#next');if(nb){nb.onclick=()=>{if(st.r+1<MAX){st.r++;save();play()}else{st.done=true;save();end()}};nb.focus({preventScroll:true})}
}

function end(){
  pips(-1);
  const t=score();
  const sq=ROUNDS.map((_,i)=>st.ok[i]?'🟩':'⬜').join('');
  if(!isTest&&N===TODAY)(window.SameySetQ=window.SameySetQ||[]).push(['mispelt',t+'/'+MAX]);
  const share=`Mispelt No. ${N+1}\n${sq} ${t}/${MAX}\n${rank(t)}\nYour go: https://samey.uk/mispelt/ #sameyuk`;
  app.innerHTML=`<div class="card center">
    <div class="tag">${isTest?'Test · ':''}No. ${N+1} · ${fmt(N,{weekday:'short',day:'numeric',month:'short'})}</div>
    <div class="rank">${rank(t)}</div>
    <div class="squares" aria-label="${t} out of ${MAX}">${sq}</div>
    <p class="muted">${t} of ${MAX}, and five new stories</p>
    <div class="btns"><button class="primary" id="share">Share</button></div>
    <p class="muted"><span data-next="Next Mispelt in {t}.">New words tomorrow.</span></p>
    <p class="muted">All the games are free and ad-free, made by one librarian in Canterbury. Enjoyed today's? <a href="https://ko-fi.com/playtheroute" target="_blank" rel="noopener" style="font-weight:700;white-space:nowrap">☕ Buy me a coffee</a></p>
  </div>
  <div class="card" style="margin-top:14px"><div class="tag">Today's stories</div>
    <ul class="recap">${ROUNDS.map((R,i)=>`<li><div class="top"><span class="k">${st.ok[i]?'✓':'•'} ${esc(R.name)}</span><span class="v">${esc(R.right)}</span></div><div class="n">${R.n}</div></li>`).join('')}</ul>
    <p class="muted" style="margin-top:12px">Think one's wrong, or know a better story? <a href="/feedback/?game=mispelt&type=puzzle&puzzle=${encodeURIComponent('No. '+(N+1))}">Tell us</a>.</p>
  </div>
  <div class="xg" data-sy-cards></div>`;
  $('#share').onclick=()=>{if(navigator.share){navigator.share({text:share}).catch(()=>{});return}try{navigator.clipboard.writeText(share).then(()=>{$('#share').textContent='Copied'})}catch(e){}};
}

if(isTest)$('#test').innerHTML=`<div class="test">Test mode: No. ${N+1} · results not saved · <a href="?day=${N+2}#test">Next day</a></div>`;
st.done?end():play();
</script>
<script src="/daily.js"></script>

</html>
