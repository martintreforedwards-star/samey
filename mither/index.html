<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mither</title>
<meta name="description" content="A daily game about the tongues of these islands: Welsh, Gaelic, Irish, Manx, Cornish, Scots, Polari and more. Five quick questions, and a story behind every answer.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://samey.uk/mither/">
<meta property="og:site_name" content="Mither">
<meta property="og:title" content="Mither: the tongues of these islands">
<meta property="og:description" content="Welsh, Gaelic, Manx, Cornish, Scots, Polari and more. Five quick questions a day.">
<meta property="og:image" content="https://samey.uk/mither/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<link rel="icon" href="/mither/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap">
<style>
:root{--bg:#f6f7f8;--card:#fff;--ink:#141a22;--muted:#5b6573;--line:#dde2e8;--accent:#c47f17;--navy:#46607a;--good:#2b8a3e;--bad:#c92a2a;--goodbg:#ebfbee;--chip:#eef1f5;--head:"Fraunces",Georgia,serif}
@media (prefers-color-scheme:dark){:root{--bg:#10141a;--card:#181d25;--ink:#eef1f6;--muted:#9aa4b4;--line:#2c3441;--accent:#f0b75a;--navy:#a9c1d9;--good:#8ce99a;--bad:#ff8787;--goodbg:#173022;--chip:#232a36}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:480px;margin:0 auto;padding:16px 16px 40px;min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
h1{font-family:var(--head);font-weight:800;font-size:34px;margin:0;line-height:1;letter-spacing:-.5px}
h1 svg{width:30px;height:30px;vertical-align:-4px;margin-right:6px}
.pips{display:flex;gap:5px}
.pip{width:12px;height:12px;border-radius:50%;background:var(--line)}
.pip.g{background:var(--good)}.pip.x{background:var(--muted)}.pip.now{background:var(--navy)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.tag{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:600}
.kind{font-family:var(--head);font-weight:800;font-size:22px;margin:4px 0 2px}
.sub{color:var(--muted);font-size:15px;margin:0 0 14px}
.sentence{font:600 20px/1.5 var(--head);margin:4px 0 12px;padding:10px 12px;border-left:4px solid var(--accent);background:var(--chip);border-radius:8px}
.sentence .on{text-decoration:underline wavy var(--accent);text-underline-offset:5px}
.big{font:600 30px/1.2 var(--head);text-align:center;margin:8px 0 10px}
.q{font-size:18px;line-height:1.55;margin:4px 0 14px}
.opts{display:grid;gap:12px}
.opt{display:block;width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);font:600 19px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);cursor:pointer;min-height:56px;text-align:left}
.opt:hover:not([disabled]){border-color:var(--navy)}
.opt:focus-visible,.primary:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--good);background:var(--goodbg)}
.opt.wrong{border-color:var(--muted);background:var(--chip)}
.opt.dim{opacity:.5}
.reveal{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--chip);font-size:15px}
.story{margin-top:8px;line-height:1.5}
.btns{display:flex;gap:10px;margin-top:14px}
button{font:inherit;color:inherit;cursor:pointer}
.primary{flex:1;padding:14px;border:0;border-radius:12px;background:var(--navy);color:var(--bg);font-weight:700;min-height:50px}
.center{text-align:center}
.rank{font-family:var(--head);font-weight:800;font-size:30px;margin:6px 0}
.squares{font-size:24px;letter-spacing:3px;margin:6px 0 4px}
.muted{color:var(--muted);font-size:15px}
a{color:var(--accent)}
.test{background:var(--chip);border-radius:10px;padding:8px 12px;font-size:14px;margin-bottom:12px}
.ex{margin:10px 0 12px;font-size:15px}.ex summary{cursor:pointer;color:var(--accent);font-weight:600}
.how{margin:8px 0 0;padding-left:20px;color:var(--muted)}
.how li{margin:3px 0}
.flag{font-size:13px;margin-left:6px}
.recap{list-style:none;padding:0;margin:8px 0 0}
.recap li{display:flex;flex-direction:column;gap:4px;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.recap .top{display:flex;justify-content:space-between;gap:10px}
.recap .k{color:var(--muted)}
.recap .v{font:600 17px/1.3 var(--head);text-align:right}
.recap .n{color:var(--muted);font-size:14px;line-height:1.45}
footer{margin-top:18px;text-align:center}
.dots{letter-spacing:2px}
</style>
<link rel="manifest" href="/manifest.webmanifest">
</head>
<body>
<main>
  <header><h1><svg viewBox="0 0 64 64" aria-hidden="true"><rect x="4" y="4" width="56" height="56" rx="12" fill="#46607a"/><path d="M15 18h34a4 4 0 0 1 4 4v16a4 4 0 0 1-4 4H30l-9 8v-8h-6a4 4 0 0 1-4-4V22a4 4 0 0 1 4-4z" fill="#fff"/><path d="M20 31q4-6 8 0t8 0 8 0" fill="none" stroke="#e8a33d" stroke-width="3.5" stroke-linecap="round"/></svg>Mither</h1><div class="pips" id="pips" aria-hidden="true"></div></header>
  <nav class="sy-bar" aria-label="Games"></nav>
  <div id="test"></div>
  <div id="app"></div>
  <footer><p class="muted"><a href="/feedback/?game=mither">Send feedback</a> · <a href="/support/?game=mither">Support the games</a></p></footer>
</main>
<script src="data.js"></script>
<script>
// ---- Which day is on screen ----
// Today's theme depends on the weekday (see data.js). ?day=N plays Mither No. N; #test plays without saving.
// Launched 25 Nov 2026, which is No. 1.
const START=Date.UTC(2026,10,25);
const dayDate=n=>new Date(START+n*864e5);
const fmt=(n,o)=>dayDate(n).toLocaleDateString('en-GB',Object.assign({timeZone:'UTC'},o));
const keyOf=n=>{const d=dayDate(n);return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0')};
addEventListener('hashchange',()=>location.reload());
const params=new URLSearchParams(location.search);
const now=new Date();
const TODAY=Math.max(0,Math.round((Date.UTC(now.getFullYear(),now.getMonth(),now.getDate())-START)/864e5));
const isTest=location.hash==='#test';
const td=parseInt(params.get('day'),10);
const N=Number.isInteger(td)&&td>=1?td-1:TODAY;
const EPOCHDAY=Math.round(dayDate(N)/864e5);
const WD=(EPOCHDAY+3)%7; // Monday = 0 (1 Jan 1970 was a Thursday)
const WEEK=Math.floor((EPOCHDAY+3)/7); // counts Monday-to-Sunday weeks
const T=THEMES[(WEEK%2?WEEK_B:WEEK_A)[WD]], DOT=DOTS[WD];
const dots='●'.repeat(DOT)+'○'.repeat(5-DOT);
const SKEY='mither-'+keyOf(N);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const plain=s=>String(s).replace(/<[^>]+>/g,'');
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){if(isTest)return;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function shuffled(arr,seed){const a=[...arr];let s=seed*9301+49297;for(let i=a.length-1;i>0;i--){s=(s*9301+49297)%233280;const j=Math.floor(s/233280*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

const ROUNDS=T.qs.map((Q,i)=>Object.assign({},Q,{opts:shuffled([Q.c,...Q.x],N*11+i+1),right:Q.c}));
const MAX=ROUNDS.length;

let st=store.get(SKEY)||{r:0,ans:[],ok:[],done:false};
const $=s=>document.querySelector(s);
const app=$('#app');
function save(){store.set(SKEY,st)}
const score=()=>st.ok.filter(Boolean).length;
function rank(t){return['Tongue-tied','Listening in','Picking it up','Getting chatty','Polyglot','Fluent in the isles'][t]}
function pips(cur){$('#pips').innerHTML=ROUNDS.map((_,i)=>`<span class="pip ${st.ok[i]===true?'g':st.ok[i]===false?'x':i===cur?'now':''}"></span>`).join('')}
const flagLink=R=>`<a class="flag" href="/feedback/?game=mither&type=puzzle&puzzle=${encodeURIComponent('No. '+(N+1)+' · '+T.name+' · '+plain(R.big||R.q)+' · '+R.right)}">Wrong?</a>`;

// Polari Sunday: show the whole sentence, with today's word underlined
function sentence(R){
  if(!T.sentence)return'';
  return `<p class="sentence">${esc(T.sentence).split(' ').map(w=>w.toLowerCase().replace(/[^a-z]/g,'')===R.big?`<span class="on">${w}</span>`:w).join(' ')}</p>`;
}

function play(){
  const i=st.r,R=ROUNDS[i],answered=st.ok[i]!=null;
  pips(i);
  const cls=o=>!answered?'':o===R.right?' right':o===st.ans[i]?' wrong':' dim';
  let body=sentence(R);
  if(R.big)body+=`<div class="big">${esc(R.big)}</div>`;
  body+=`<p class="q">${R.q}</p>`;
  body+=`<div class="opts" role="group" aria-label="Answers">${R.opts.map(o=>`<button class="opt${cls(o)}" data-o="${esc(o)}"${answered?' disabled':''}>${esc(o)}</button>`).join('')}</div>`;
  let reveal='';
  if(answered){
    const head=st.ok[i]?'Right!':`Not quite. It's <b>${esc(R.right)}</b>.`;
    reveal=`<div class="reveal" role="status"><b>${head}</b><div class="story">${R.n}</div>${flagLink(R)}</div>
    <div class="btns"><button class="primary" id="next">${i+1<MAX?'Next question':'See how you did'}</button></div>`;
  }
  app.innerHTML=`<div class="card">
    <div class="tag">${isTest?'Test · ':''}No. ${N+1} · ${fmt(N,{weekday:'short',day:'numeric',month:'short'})} · <span class="dots" aria-label="Difficulty ${DOT} of 5">${dots}</span> · ${i+1} of ${MAX}</div>
    <div class="kind">${T.name}</div>
    <p class="sub">${T.sub}</p>
    ${i===0&&!answered?`<details class="ex"><summary>How to play</summary><ol class="how">
      <li>A daily game about the tongues of these islands: Welsh, Gaelic, Irish, Manx, Cornish, Scots, Polari and more.</li>
      <li>Five questions on one theme, one point each, and a short story after every answer.</li>
      <li>Monday: which tongue? Tuesday: cousin words. Wednesday: place names. Thursday: Scots.</li>
      <li>Friday and Saturday take turns between hidden, new, revived and lost languages.</li>
      <li>Sunday is the boss: translate a sentence of Polari.</li></ol></details>`:''}
    ${body}
    ${reveal}
  </div>`;
  if(!answered)app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{st.ans[i]=b.dataset.o;st.ok[i]=b.dataset.o===R.right;save();play()});
  const nb=$('#next');if(nb){nb.onclick=()=>{if(st.r+1<MAX){st.r++;save();play()}else{st.done=true;save();end()}};nb.focus({preventScroll:true})}
}

function end(){
  pips(-1);
  const t=score();
  const sq=ROUNDS.map((_,i)=>st.ok[i]?'🟩':'⬜').join('');
  if(!isTest&&N===TODAY)(window.SameySetQ=window.SameySetQ||[]).push(['mither',t+'/'+MAX]);
  const share=`Mither No. ${N+1} · ${T.name}\n${sq} ${t}/${MAX}\n${rank(t)}\nYour go: https://samey.uk/mither/ #sameyuk`;
  app.innerHTML=`<div class="card center">
    <div class="tag">${isTest?'Test · ':''}No. ${N+1} · ${fmt(N,{weekday:'short',day:'numeric',month:'short'})} · ${T.name}</div>
    <div class="rank">${rank(t)}</div>
    <div class="squares" aria-label="${t} out of ${MAX}">${sq}</div>
    <p class="muted">${t} of ${MAX}${T.sentence?`<br>“${esc(T.sentence)}”<br>Look at the man with the lovely hair and the awful shoes.`:''}</p>
    <div class="btns"><button class="primary" id="share">Share</button></div>
    <p class="muted"><span data-next="Next Mither in {t}.">A new theme tomorrow.</span></p>
    <p class="muted">All the games are free and ad-free, made by one librarian in Canterbury. Enjoyed today's? <a href="https://ko-fi.com/playtheroute" target="_blank" rel="noopener" style="font-weight:700;white-space:nowrap">☕ Buy me a coffee</a></p>
  </div>
  <div class="card" style="margin-top:14px"><div class="tag">Today's stories</div>
    <ul class="recap">${ROUNDS.map((R,i)=>`<li><div class="top"><span class="k">${st.ok[i]?'✓':'•'} ${esc(plain(R.big||R.q))}</span><span class="v">${esc(R.right)}</span></div><div class="n">${R.n}</div></li>`).join('')}</ul>
    <p class="muted" style="margin-top:12px">Speak one of these languages and spot a mistake? <a href="/feedback/?game=mither&type=puzzle&puzzle=${encodeURIComponent('No. '+(N+1))}">Tell us</a>.</p>
  </div>
  <div class="xg" data-sy-cards></div>`;
  $('#share').onclick=()=>{if(navigator.share){navigator.share({text:share}).catch(()=>{});return}try{navigator.clipboard.writeText(share).then(()=>{$('#share').textContent='Copied'})}catch(e){}};
}

if(isTest)$('#test').innerHTML=`<div class="test">Test mode: No. ${N+1} · ${T.name} · results not saved · <a href="?day=${N+2}#test">Next day</a></div>`;
st.done?end():play();
</script>
<script src="/daily.js"></script>
