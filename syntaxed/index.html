<style>
:root{--bg:#faf7f2;--card:#fff;--ink:#1f1d1a;--muted:#6b665e;--line:#e4ddd2;--accent:#3b5bdb;--good:#2f9e44;--bad:#e03131;--goodbg:#ebfbee;--badbg:#fff5f5;--chip:#f1ece4}
@media (prefers-color-scheme:dark){:root{--bg:#16171a;--card:#202227;--ink:#f1efe9;--muted:#a19c93;--line:#363940;--accent:#748ffc;--on-accent:#0b1530;--good:#51cf66;--bad:#ff6b6b;--goodbg:#1d3324;--badbg:#3a1f22;--chip:#2b2e35}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:480px;margin:0 auto;padding:16px 16px 40px;min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
h1{font-size:26px;margin:0;letter-spacing:-.5px}
h1 span{color:var(--accent)}
.dots{display:flex;gap:6px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dot.cur{background:var(--accent)}.dot.ok{background:var(--good)}.dot.no{background:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.tag{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:600}
.tag.boss{color:var(--accent)}
.q{font-size:19px;font-weight:600;margin:6px 0 4px}
.sentence{font-size:21px;font-family:Georgia,"Times New Roman",serif;margin:12px 0 4px}
.opts{display:grid;gap:10px;margin-top:16px}
button{font:inherit;color:inherit;cursor:pointer}
.opt{text-align:left;padding:14px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--card)}
.opt.right{border-color:var(--good);background:var(--goodbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt.right::after{content:" ✓";font-weight:700}.opt.wrong::after{content:" ✗";font-weight:700}
.opt[disabled]{cursor:default}
.reveal{margin-top:16px;padding:14px 16px;border-radius:12px;background:var(--chip)}
.reveal b{display:block;margin-bottom:2px}
.primary{display:block;width:100%;margin-top:16px;padding:14px;border:0;border-radius:12px;background:var(--accent);color:var(--on-accent,#fff);font-weight:600}
.primary[disabled]{opacity:.4;cursor:default}
.ghost{display:block;width:100%;margin-top:10px;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:none;font-weight:600}
.line{min-height:58px;border:1.5px dashed var(--line);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;align-content:flex-start}
.line.right{border-style:solid;border-color:var(--good);background:var(--goodbg)}
.line.wrong{border-style:solid;border-color:var(--bad);background:var(--badbg)}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.w{padding:9px 13px;border-radius:10px;border:1px solid var(--line);background:var(--chip)}
.w.used{visibility:hidden}
.center{text-align:center}
.ticks{font-size:34px;letter-spacing:4px;margin:10px 0}
.score{font-size:44px;font-weight:700;margin:4px 0}
.rank{font-size:20px;font-weight:700;color:var(--accent)}
.muted{color:var(--muted)}
ul.rounds{padding-left:20px;margin:10px 0 0}
footer{margin-top:24px;text-align:center;font-size:15px}
footer a{color:var(--accent);text-decoration:none;margin:0 6px}
.test{font-size:13px;color:var(--bad);text-align:center;margin-bottom:8px}
.archline{font-size:15px;color:var(--muted);margin:-4px 0 12px}
.archline a,.card a.inl{color:var(--accent);font-weight:600}
.archlist{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:8px}
.archlist a{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;min-height:52px;border:1.5px solid var(--line);border-radius:12px;color:inherit;text-decoration:none;font-weight:600}
.archlist a:hover{border-color:var(--ink)}
.archlist .when{font-weight:400;color:var(--muted);font-size:15px}
.archlist .st{font-size:15px;white-space:nowrap;color:var(--muted)}
.archlist .st.done{color:var(--good)}
a.primary{text-align:center;text-decoration:none}

/* Cross-game cards (same design as Samey's result cards) */
.card + .xg{margin-top:14px}
.xg{display:flex;flex-direction:column;gap:10px;text-align:left;--xg-s:var(--surface,var(--card,#fff))}
.xg .xg-head{text-align:left;margin:4px 0 0;font-size:.92rem;font-weight:700;color:var(--muted)}
.xg-card{--c:#1f7a6d;display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:10px;background:color-mix(in srgb,var(--c) 12%,var(--xg-s));border:2px solid var(--c);color:var(--ink);text-decoration:none;min-height:44px}
.xg-card:hover .xg-arrow{transform:translateX(3px)}
.xg-card:focus-visible{outline:3px solid var(--c);outline-offset:2px}
.xg-icon{flex:none;width:48px;height:48px}
.xg-text{display:flex;flex-direction:column;gap:1px;min-width:0}
.xg-new{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:color-mix(in srgb,var(--c) 60%,var(--ink))}
.xg-title{font-family:var(--display,inherit);font-weight:800;font-size:1.3rem;line-height:1.1}
.xg-sub{font-size:.9rem;color:var(--muted)}
.xg-arrow{margin-left:auto;font-size:1.4rem;font-weight:700;flex:none;color:color-mix(in srgb,var(--c) 60%,var(--ink));transition:transform .15s}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.xg-samey{--c:#1f7a6d}.xg-spinonym{--c:#d99a1e}.xg-dotty{--c:#E2405A}.xg-syntaxed{--c:#3B5BDB}.xg-passe{--c:#7B3F73}.xg-natter{--c:#B0186A}
</style>
</head>

const NEW_GARDEN = [
  {sentence:'The old man the boat.',opts:['Older people are crewing the boat','An old man owns a boat','The boat is very old','An old man is in the boat'],reveal:'"The old" are the people and "man" is the verb: they crew the boat.'},

  {sentence:'When Fred eats food gets thrown.',opts:['Food gets thrown whenever Fred eats','Fred eats food that has been thrown','Fred throws food at people','Fred only eats thrown food'],reveal:'A comma after "eats" would have saved everyone.'},
  {sentence:'The man who hunts ducks out on weekends.',opts:['The hunter slips away at weekends','He hunts ducks at weekends','Ducks are hunted outdoors','A man hunts every weekend'],reveal:'"Ducks out" means slips away. He isn\'t hunting ducks at all.'}
];

// ---- Schedule: each round type works through its own list, one entry per day ----
// Syntaxed No. 1 was launch day, Sat 17 Oct 2026. The first week replays the original Mon–Sun puzzles from that Saturday,
// then the new ones follow. Sundays add a Garden Path boss round. When a list runs out it starts again from the top,
// so add more to the NEW_ lists above before then. As written they last 35 days, to Fri 20 Nov 2026.
const LAUNCH_ORDER=[6,7,1,2,3,4,5];
const TYPES=['sneaked','eggcorn','shuffle','danglers'];
const POOL={};
for(const t of TYPES){ const extra={sneaked:NEW_SNEAKED,eggcorn:NEW_EGGCORN,shuffle:NEW_SHUFFLE,danglers:NEW_DANGLERS}[t];
  POOL[t]=[...LAUNCH_ORDER.map(d=>PUZZLES[d].find(r=>r.type===t)), ...extra.map(r=>Object.assign({type:t},r))]; }
POOL.garden=[PUZZLES[7].find(r=>r.type==='garden'), ...NEW_GARDEN.map(r=>Object.assign({type:'garden'},r))];
const START=Date.UTC(2026,9,17);
const dayDate=n=>new Date(START+n*864e5);   // read with UTC getters
const keyOf=n=>{const d=dayDate(n);return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0')};
const fmt=(n,o)=>dayDate(n).toLocaleDateString('en-GB',Object.assign({timeZone:'UTC'},o));
function roundsFor(n){
  const rs=TYPES.map(t=>POOL[t][n%POOL[t].length]);
  if(dayDate(n).getUTCDay()===0) rs.push(POOL.garden[(Math.floor((n+6)/7)-1)%POOL.garden.length]);
  return rs;
}

// ---- Which day is on screen ----
// samey.uk/syntaxed/#test plays today without saving; add ?day=N for Syntaxed No. N (any day, past or future).
// ?day=N on its own opens an earlier puzzle from the archive.
const ARCHIVE_ON=true;
addEventListener('hashchange',()=>location.reload());
const params=new URLSearchParams(location.search);
const now=new Date();
const TODAY=Math.max(0,Math.round((Date.UTC(now.getFullYear(),now.getMonth(),now.getDate())-START)/864e5));
const isTest=location.hash==='#test';
const ARCH=ARCHIVE_ON||isTest||location.hash==='#archive';
const ARCH_TAIL=ARCHIVE_ON?(isTest?'#test':''):(isTest?'#test':'#archive');
const td=parseInt(params.get('day'),10);
const N=Number.isInteger(td)&&td>=1&&(isTest||(ARCH&&td<=TODAY))?td-1:TODAY;
const isArch=!isTest&&N<TODAY;
const dayNum=dayDate(N).getUTCDay()||7;   // Mon=1 … Sun=7, also part of the option-order seed
const dateKey=keyOf(N);
const rounds=roundsFor(N);
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

// Seeded shuffle so everyone sees the same option order on the same day
function rng(seed){let h=1779033703^seed.length;for(let i=0;i<seed.length;i++){h=Math.imul(h^seed.charCodeAt(i),3432918353);h=h<<13|h>>>19}return function(){h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);h^=h>>>16;return(h>>>0)/4294967296}}
function order(n,seed){const r=rng(seed),a=[...Array(n).keys()];for(let i=n-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

const $=s=>document.querySelector(s);
const app=$('#app');
let st={i:0,res:[]};

function dots(){$('#dots').innerHTML=rounds.map((_,k)=>`<div class="dot ${st.res[k]===true?'ok':st.res[k]===false?'no':k===st.i?'cur':''}"></div>`).join('')}

function intro(){
  const sunday=rounds.length===5;
  app.innerHTML=`<div class="card"><div class="tag">${sunday?'Sunday · boss round day':isArch||isTest?fmt(N,{weekday:'long',day:'numeric',month:'long'}):'Today'}</div>
  <div class="q">${rounds.length} quick rounds. One try each.</div>
  <ul class="rounds">${rounds.map(r=>`<li>${LABEL[r.type]}</li>`).join('')}</ul>
  <button class="primary" id="go">Play</button></div>`;
  $('#go').onclick=()=>{st={i:0,res:[]};round()};
  dots();
}

function round(){
  const r=rounds[st.i];dots();
  let h=`<div class="card"><div class="tag ${r.type==='garden'?'boss':''}">Round ${st.i+1} · ${LABEL[r.type]}</div><div class="q">${ASK[r.type]}</div>`;
  if(r.sentence)h+=`<div class="sentence">“${r.sentence}”</div>`;
  if(r.type==='shuffle'){
    h+=`<div class="line" id="line"></div><div class="pool" id="pool">${r.words.map((w,k)=>`<button class="w" data-k="${k}">${w}</button>`).join('')}</div><button class="primary" id="check" disabled>Check</button>`;
  }else{
    h+=`<div class="opts">${order(r.opts.length,dateKey+dayNum+st.i).map(k=>`<button class="opt" data-k="${k}">${r.opts[k]}</button>`).join('')}</div>`;
  }
  h+=`<div id="after" aria-live="polite"></div></div>`;
  app.innerHTML=h;
  r.type==='shuffle'?shuffleRound(r):pickRound(r);
}

function pickRound(r){
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const k=+b.dataset.k,ok=k===0;
    app.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(+x.dataset.k===0)x.classList.add('right')});
    if(!ok)b.classList.add('wrong');
    after(ok,r.reveal);
  });
}

function shuffleRound(r){
  const placed=[];const line=$('#line'),check=$('#check');
  function draw(){
    line.innerHTML=placed.map((k,p)=>`<button class="w" data-p="${p}">${r.words[k]}</button>`).join('');
    app.querySelectorAll('#pool .w').forEach(b=>b.classList.toggle('used',placed.includes(+b.dataset.k)));
    line.querySelectorAll('.w').forEach(b=>b.onclick=()=>{placed.splice(+b.dataset.p,1);draw()});
    check.disabled=placed.length!==r.words.length;
  }
  app.querySelectorAll('#pool .w').forEach(b=>b.onclick=()=>{const k=+b.dataset.k;if(!placed.includes(k)){placed.push(k);draw()}});
  check.onclick=()=>{
    const norm=x=>x.toLowerCase().replace(/[^a-z' ]/g,'').replace(/\s+/g,' ').trim();   // ignore commas and capitals
    const ok=norm(placed.map(k=>r.words[k]).join(' '))===norm(r.answer);
    line.classList.add(ok?'right':'wrong');
    line.querySelectorAll('.w').forEach(b=>b.onclick=null);
    $('#pool').remove();check.remove();
    after(ok,(ok?'':'It was: '+r.answer+'. ')+r.reveal);
  };
  draw();
}

function after(ok,text){
  st.res[st.i]=ok;dots();
  const last=st.i===rounds.length-1;
  $('#after').innerHTML=`<div class="reveal"><b>${ok?'Nicely done.':'Not quite.'}</b>${text||''}</div><button class="primary" id="next">${last?'See results':'Next round'}</button>`;
  $('#next').onclick=()=>{if(last){if(!isTest)store.set('syntaxed-'+dateKey,st.res);results()}else{st.i++;round()}};
}

function rank(s,n){const f=s/n;return f===1?'Syntax Sorcerer':f>=.75?'Tidy Clause':f>=.5?'Split Infinitive':f>0?'Comma Splice':'Run-on Sentence'}

function results(){
  st.i=rounds.length;dots();
  const s=st.res.filter(Boolean).length,n=rounds.length;
  const ticks=st.res.map(x=>x?'✅':'❌').join('');
  if(!isTest&&!isArch)(window.SameySetQ=window.SameySetQ||[]).push(['syntaxed',s+'/'+n]);
  const nice=fmt(N,{weekday:'short',day:'numeric',month:'short'});
  const share=`Syntaxed ${isArch?`No. ${N+1} (archive)`:nice}\n${s}/${n} ${ticks}\n${rank(s,n)}\nsamey.uk/syntaxed/`;
  app.innerHTML=`<div class="card center"><div class="tag">${isTest?'Test · No. '+(N+1)+' · '+nice:isArch?'No. '+(N+1)+' · '+nice:nice}</div>
  <div class="score">${s}/${n}</div><div class="ticks">${ticks}</div><div class="rank">${rank(s,n)}</div>
  <p class="muted">${isArch?`<a class="inl" href="#" id="moreArch">Play another earlier puzzle</a> or <a class="inl" href="./${ARCH_TAIL}">go back to today's puzzle</a>.`:'<span data-next="Next Syntaxed in {t}.">See you tomorrow.</span>'+(n===5?'':' Sunday brings a boss round.')+(ARCH&&TODAY>=1&&!isTest?` Can't wait? <a class="inl" href="#" id="moreArch">Play earlier puzzles</a>.`:'')}</p>
  <button class="primary" id="share">Share</button><button class="ghost" id="copy">Copy result</button></div>${document.getElementById('xgCards').innerHTML}`;
  $('#share').onclick=()=>{if(navigator.share){navigator.share({text:share}).catch(()=>{})}else{location.href='https://wa.me/?text='+encodeURIComponent(share)}};
  $('#copy').onclick=()=>{try{navigator.clipboard.writeText(share);$('#copy').textContent='Copied'}catch(e){}};
  const more=$('#moreArch');if(more)more.onclick=e=>{e.preventDefault();openArchive()};
}

function openArchive(){
  const items=[];
  for(let k=TODAY-1;k>=0;k--){
    const r=store.get('syntaxed-'+keyOf(k)),n=roundsFor(k).length,boss=n===5?' · boss round':'';
    const stx=r&&r.length===n?`<span class="st done">${r.filter(Boolean).length}/${n}</span>`:'<span class="st">Play →</span>';
    items.push(`<li><a href="?day=${k+1}${ARCH_TAIL}"><span>No. ${k+1} <span class="when">· ${fmt(k,{weekday:'short',day:'numeric',month:'short'})}${boss}</span></span>${stx}</a></li>`);
  }
  if(!items.length)items.push('<li class="muted">No earlier puzzles yet. Come back tomorrow.</li>');
  $('#archLine').hidden=true;$('#dots').innerHTML='';
  app.innerHTML=`<div class="card"><div class="q" style="font-size:22px;margin-top:0">Earlier puzzles</div>
  <p class="muted" style="margin:4px 0 0">Missed a day? Every past Syntaxed is here.</p>
  <ul class="archlist">${items.join('')}</ul><a class="primary" href="./${ARCH_TAIL}">Back to today's puzzle</a></div>`;
  window.scrollTo(0,0);
}

if(isTest)$('#test').innerHTML=`<div class="test">Test mode: No. ${N+1} · ${fmt(N,{weekday:'short',day:'numeric',month:'short'})} · results not saved</div>`;
if(ARCH&&TODAY>=1){$('#archFoot').hidden=false;$('#archLink').onclick=e=>{e.preventDefault();openArchive()};}
if(isArch){const l=$('#archLine');l.hidden=false;l.innerHTML=`Earlier puzzle · No. ${N+1} · <a href="./${ARCH_TAIL}">Today's puzzle</a>`;}
const done=!isTest&&store.get('syntaxed-'+dateKey);
// Wait for the page to finish loading: the results screen uses the 'Fancy another?' cards further down.
document.addEventListener('DOMContentLoaded',()=>{if(done&&done.length===rounds.length){st.res=done;results()}else intro();});
</script>
