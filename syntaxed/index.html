<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Syntaxed</title>
<meta name="description" content="A daily grammar game that's more giggle than red pen. Four quick rounds, plus a boss round on Sundays.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:url" content="https://samey.uk/syntaxed/">
<meta property="og:site_name" content="Syntaxed">
<meta property="og:title" content="Syntaxed: grammar, but make it giggle">
<meta property="og:description" content="A daily grammar game. Four quick rounds, plus a boss round on Sundays.">
<style>
:root{--bg:#faf7f2;--card:#fff;--ink:#1f1d1a;--muted:#6b665e;--line:#e4ddd2;--accent:#3b5bdb;--good:#2f9e44;--bad:#e03131;--goodbg:#ebfbee;--badbg:#fff5f5;--chip:#f1ece4}
@media (prefers-color-scheme:dark){:root{--bg:#16171a;--card:#202227;--ink:#f1efe9;--muted:#a19c93;--line:#363940;--accent:#748ffc;--good:#51cf66;--bad:#ff6b6b;--goodbg:#1d3324;--badbg:#3a1f22;--chip:#2b2e35}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:480px;margin:0 auto;padding:16px 16px 40px;min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
h1{font-size:26px;margin:0;letter-spacing:-.5px}
h1 span{color:var(--accent)}
.dots{display:flex;gap:6px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dot.cur{background:var(--accent)}.dot.ok{background:var(--good)}.dot.no{background:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.tag{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:600}
.tag.boss{color:var(--accent)}
.q{font-size:19px;font-weight:600;margin:6px 0 4px}
.sentence{font-size:21px;font-family:Georgia,"Times New Roman",serif;margin:12px 0 4px}
.opts{display:grid;gap:10px;margin-top:16px}
button{font:inherit;color:inherit;cursor:pointer}
.opt{text-align:left;padding:14px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--card)}
.opt.right{border-color:var(--good);background:var(--goodbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt[disabled]{cursor:default}
.reveal{margin-top:16px;padding:14px 16px;border-radius:12px;background:var(--chip)}
.reveal b{display:block;margin-bottom:2px}
.primary{display:block;width:100%;margin-top:16px;padding:14px;border:0;border-radius:12px;background:var(--accent);color:#fff;font-weight:600}
.primary[disabled]{opacity:.4;cursor:default}
.ghost{display:block;width:100%;margin-top:10px;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:none;font-weight:600}
.line{min-height:58px;border:1.5px dashed var(--line);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;align-content:flex-start}
.line.right{border-style:solid;border-color:var(--good);background:var(--goodbg)}
.line.wrong{border-style:solid;border-color:var(--bad);background:var(--badbg)}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.w{padding:9px 13px;border-radius:10px;border:1px solid var(--line);background:var(--chip)}
.w.used{visibility:hidden}
.center{text-align:center}
.ticks{font-size:34px;letter-spacing:4px;margin:10px 0}
.score{font-size:44px;font-weight:700;margin:4px 0}
.rank{font-size:20px;font-weight:700;color:var(--accent)}
.muted{color:var(--muted)}
ul.rounds{padding-left:20px;margin:10px 0 0}
footer{margin-top:24px;text-align:center;font-size:15px}
footer a{color:var(--accent);text-decoration:none;margin:0 6px}
.test{font-size:13px;color:var(--bad);text-align:center;margin-bottom:8px}
</style>
</head>
<body>
<main>
  <header><h1>Syntax<span>ed</span></h1><div class="dots" id="dots"></div></header>
  <div id="test"></div>
  <div id="app"></div>
  <footer><span class="muted">More games:</span><a href="/">Samey</a><a href="/spinonym/">Spinonym</a><a href="/dotty/">Dotty</a>
  <p class="muted" style="margin-top:10px"><a href="/feedback/?game=syntaxed">Send feedback</a> · <a href="/support/?game=syntaxed">Support us</a></p></footer>
</main>
<script>
// ---- Puzzle data: first option in every opts list is the correct answer (shuffled on screen) ----
const PUZZLES = {
 1:[
  {type:'sneaked',opts:['blink → blank','sneak → snuck','dive → dove','strive → strove'],reveal:'Snuck and dove are real (dove is mostly American). Blank is a word, just not this one.'},
  {type:'eggcorn',opts:['for all intensive purposes','nip it in the bud','a far cry from','beyond the pale'],reveal:"It's \"intents and purposes\", from old English legal wording."},
  {type:'shuffle',words:['broth','cooks','spoil','many','the','too'],answer:'Too many cooks spoil the broth',reveal:'Six words, one kitchen disaster.'},
  {type:'danglers',sentence:'Covered in ketchup, Dad ate the chips.',opts:['Dad was covered in ketchup','The chips had ketchup on','The table was a mess','Dad dropped the bottle'],reveal:'The opening bit attaches to whoever comes next: Dad.'}
 ],
 2:[
  {type:'sneaked',opts:['grieve → grove','weave → wove','cleave → clove','heave → hove'],reveal:'Hove survives at sea: a ship "hove into view". Grove is just trees.'},
  {type:'eggcorn',opts:['a doggy-dog world','on tenterhooks','toe the line','hunky-dory'],reveal:"It's \"dog-eat-dog\". Doggy-dog sounds far friendlier."},
  {type:'shuffle',words:['worm','early','the','catches','bird','the'],answer:'The early bird catches the worm',reveal:''},
  {type:'danglers',sentence:'Walking to school, the rain started to pour.',opts:['The rain was walking to school','We got soaked on the way','It rained before school','School was cancelled'],reveal:"Nobody's walking in that sentence except the rain."}
 ],
 3:[
  {type:'sneaked',opts:['bite → bote','slay → slew','stride → strode','smite → smote'],reveal:"Slew, strode and smote all sound made up, but they're real."},
  {type:'eggcorn',opts:['free reign','home in on','deep-seated','short shrift'],reveal:"It's \"free rein\": loose reins on a horse, not a monarch."},
  {type:'shuffle',words:['they','count','hatch',"don't",'before','chickens','your'],answer:"Don't count your chickens before they hatch",reveal:''},
  {type:'danglers',sentence:'Having finished the homework, the TV was switched on.',opts:['The TV finished the homework','The children watched TV after homework','The TV was on during homework','Homework was done in front of the TV'],reveal:'Clever telly.'}
 ],
 4:[
  {type:'sneaked',opts:['preach → praught','teach → taught','catch → caught','beseech → besought'],reveal:"English isn't consistent: it's just \"preached\"."},
  {type:'eggcorn',opts:['an old wise tale','a damp squib','a moot point','with bated breath'],reveal:"It's \"old wives' tale\". Bated is short for abated: held back."},
  {type:'shuffle',words:['boils','pot','never','watched','a'],answer:'A watched pot never boils',reveal:''},
  {type:'danglers',sentence:'The man was chased by a dog in a bowler hat.',opts:['The dog was wearing the bowler hat','The man wore a bowler hat','The chase happened in a hat shop','The dog stole a hat'],reveal:'A very smart dog.'}
 ],
 5:[
  {type:'sneaked',opts:['need → ned','wake → woke','shine → shone','speed → sped'],reveal:"Sped sounds borrowed from speed; ned doesn't follow."},
  {type:'eggcorn',opts:['the statue of limitations','pique your interest','per se','a case in point'],reveal:'A statute is a law, not a stone figure.'},
  {type:'shuffle',words:['a','silver','cloud','has','lining','every'],answer:'Every cloud has a silver lining',reveal:''},
  {type:'danglers',sentence:"Freshly baked, the children couldn't wait to eat the scones.",opts:['The children were freshly baked','The scones were fresh from the oven','The children baked scones','The scones went cold'],reveal:'Warm, golden children.'}
 ],
 6:[
  {type:'sneaked',opts:['rake → rook','plead → pled','bid → bade','forsake → forsook'],reveal:'Pled is common in Scotland and the US. A rook is a bird.'},
  {type:'eggcorn',opts:['an escape goat','wreak havoc','sleight of hand','in one fell swoop'],reveal:"Scapegoat: the goat sent away carrying everyone's blame."},
  {type:'shuffle',words:['milk','no','crying',"it's",'over','spilt','use'],answer:"It's no use crying over spilt milk",reveal:'"Spilt" is the British spelling.'},
  {type:'danglers',sentence:'Rusty and old, Grandad sold his bike.',opts:['Grandad was rusty and old','The bike was rusty','Grandad bought a new bike','The bike sold for a lot'],reveal:'Sorry, Grandad.'}
 ],
 7:[
  {type:'sneaked',opts:['ping → pung','sling → slung','cling → clung','fling → flung'],reveal:"Ping rhymes with the others, but it's just \"pinged\"."},
  {type:'eggcorn',opts:['one in the same','just deserts','a shoo-in','to the manner born'],reveal:"It's \"one and the same\". The others look wrong but are right."},
  {type:'shuffle',words:['not','glitters','gold','all','is','that'],answer:'All that glitters is not gold',reveal:'Shakespeare\'s version was "glisters".'},
  {type:'danglers',sentence:'She served sandwiches to the guests on paper plates.',opts:['The guests were sitting on paper plates','The sandwiches were on paper plates','The plates were paper','She ran out of plates'],reveal:'Flimsy seating.'},
  {type:'garden',sentence:'The horse raced past the barn fell.',opts:['A horse, that someone raced past the barn, fell over','A horse raced past a fallen barn','The barn fell on a horse','A horse fell past the barn'],reveal:'The famous one: "raced past the barn" describes the horse.'}
 ]
};

const LABEL={sneaked:'Sneaked',eggcorn:'Eggcorn',shuffle:'Shuffle',danglers:'Danglers',garden:'Garden Path · Boss round'};
const ASK={sneaked:'Which past tense is made up?',eggcorn:'Which phrase has been misheard?',shuffle:'Put the words back in order',danglers:'What does it literally say?',garden:'What does it actually mean?'};

// ---- Day selection: Mon=1 … Sun=7. Add ?day=1..7 to the URL to test any day. ----
const params=new URLSearchParams(location.search);
const td=parseInt(params.get('day'),10);
const isTest=td>=1&&td<=7;
const now=new Date();
const dayNum=isTest?td:(now.getDay()||7);
const dateKey=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
const rounds=PUZZLES[dayNum];
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

// Seeded shuffle so everyone sees the same option order on the same day
function rng(seed){let h=1779033703^seed.length;for(let i=0;i<seed.length;i++){h=Math.imul(h^seed.charCodeAt(i),3432918353);h=h<<13|h>>>19}return function(){h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);h^=h>>>16;return(h>>>0)/4294967296}}
function order(n,seed){const r=rng(seed),a=[...Array(n).keys()];for(let i=n-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

const $=s=>document.querySelector(s);
const app=$('#app');
let st={i:0,res:[]};

function dots(){$('#dots').innerHTML=rounds.map((_,k)=>`<div class="dot ${st.res[k]===true?'ok':st.res[k]===false?'no':k===st.i?'cur':''}"></div>`).join('')}

function intro(){
  const sunday=rounds.length===5;
  app.innerHTML=`<div class="card"><div class="tag">${sunday?'Sunday · boss round day':'Today'}</div>
  <div class="q">${rounds.length} quick rounds. One try each.</div>
  <ul class="rounds">${rounds.map(r=>`<li>${LABEL[r.type]}</li>`).join('')}</ul>
  <button class="primary" id="go">Play</button></div>`;
  $('#go').onclick=()=>{st={i:0,res:[]};round()};
  dots();
}

function round(){
  const r=rounds[st.i];dots();
  let h=`<div class="card"><div class="tag ${r.type==='garden'?'boss':''}">Round ${st.i+1} · ${LABEL[r.type]}</div><div class="q">${ASK[r.type]}</div>`;
  if(r.sentence)h+=`<div class="sentence">“${r.sentence}”</div>`;
  if(r.type==='shuffle'){
    h+=`<div class="line" id="line"></div><div class="pool" id="pool">${r.words.map((w,k)=>`<button class="w" data-k="${k}">${w}</button>`).join('')}</div><button class="primary" id="check" disabled>Check</button>`;
  }else{
    h+=`<div class="opts">${order(r.opts.length,dateKey+dayNum+st.i).map(k=>`<button class="opt" data-k="${k}">${r.opts[k]}</button>`).join('')}</div>`;
  }
  h+=`<div id="after"></div></div>`;
  app.innerHTML=h;
  r.type==='shuffle'?shuffleRound(r):pickRound(r);
}

function pickRound(r){
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const k=+b.dataset.k,ok=k===0;
    app.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(+x.dataset.k===0)x.classList.add('right')});
    if(!ok)b.classList.add('wrong');
    after(ok,r.reveal);
  });
}

function shuffleRound(r){
  const placed=[];const line=$('#line'),check=$('#check');
  function draw(){
    line.innerHTML=placed.map((k,p)=>`<button class="w" data-p="${p}">${r.words[k]}</button>`).join('');
    app.querySelectorAll('#pool .w').forEach(b=>b.classList.toggle('used',placed.includes(+b.dataset.k)));
    line.querySelectorAll('.w').forEach(b=>b.onclick=()=>{placed.splice(+b.dataset.p,1);draw()});
    check.disabled=placed.length!==r.words.length;
  }
  app.querySelectorAll('#pool .w').forEach(b=>b.onclick=()=>{const k=+b.dataset.k;if(!placed.includes(k)){placed.push(k);draw()}});
  check.onclick=()=>{
    const guess=placed.map(k=>r.words[k]).join(' ').toLowerCase();
    const ok=guess===r.answer.toLowerCase();
    line.classList.add(ok?'right':'wrong');
    line.querySelectorAll('.w').forEach(b=>b.onclick=null);
    $('#pool').remove();check.remove();
    after(ok,(ok?'':'It was: '+r.answer+'. ')+r.reveal);
  };
  draw();
}

function after(ok,text){
  st.res[st.i]=ok;dots();
  const last=st.i===rounds.length-1;
  $('#after').innerHTML=`<div class="reveal"><b>${ok?'Nicely done.':'Not quite.'}</b>${text||''}</div><button class="primary" id="next">${last?'See results':'Next round'}</button>`;
  $('#next').onclick=()=>{if(last){if(!isTest)store.set('syntaxed-'+dateKey,st.res);results()}else{st.i++;round()}};
}

function rank(s,n){const f=s/n;return f===1?'Syntax Sorcerer':f>=.75?'Tidy Clause':f>=.5?'Split Infinitive':f>0?'Comma Splice':'Run-on Sentence'}

function results(){
  st.i=rounds.length;dots();
  const s=st.res.filter(Boolean).length,n=rounds.length;
  const ticks=st.res.map(x=>x?'✅':'❌').join('');
  const nice=now.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
  const share=`Syntaxed ${nice}\n${s}/${n} ${ticks}\n${rank(s,n)}\nsamey.uk/syntaxed/`;
  app.innerHTML=`<div class="card center"><div class="tag">${isTest?'Test day '+dayNum:nice}</div>
  <div class="score">${s}/${n}</div><div class="ticks">${ticks}</div><div class="rank">${rank(s,n)}</div>
  <p class="muted">${n===5?'See you tomorrow.':'Sunday brings a boss round.'}</p>
  <button class="primary" id="share">Share</button><button class="ghost" id="copy">Copy result</button></div>`;
  $('#share').onclick=()=>{if(navigator.share){navigator.share({text:share}).catch(()=>{})}else{location.href='https://wa.me/?text='+encodeURIComponent(share)}};
  $('#copy').onclick=()=>{try{navigator.clipboard.writeText(share);$('#copy').textContent='Copied'}catch(e){}};
}

if(isTest)$('#test').innerHTML=`<div class="test">Test mode: day ${dayNum} · results not saved</div>`;
const done=!isTest&&store.get('syntaxed-'+dateKey);
if(done&&done.length===rounds.length){st.res=done;results()}else intro();
</script>

</body>
</html>
